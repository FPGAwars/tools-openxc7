# F4 — build the openXC7 package natively per OS and publish both assets to the
# same dated GitHub release (linux-x86-64 + darwin-arm64), so they coexist.
#
# Native build only — nixpkgs does not support cross Linux<->macOS, so each
# package is built on its own runner. The package date is forced via
# OPENXC7_PACK_DATE so the tarball name/VERSION match the release tag.
name: release

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Release date YYYY-MM-DD (default: today, UTC)"
        required: false
  push:
    tags:
      - '20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]'   # dated tags, e.g. 2026-06-20

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.d.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            DATE="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE="$(date -u +%Y-%m-%d)"
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Release date: $DATE"
          # Create the release once here (no race between the build jobs).
          gh release view "$DATE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$DATE" --repo "$GITHUB_REPOSITORY" \
              --title "$DATE" --notes "openXC7 toolchain — $DATE"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            token: linux-x86-64
          - runner: macos-14            # Apple Silicon => darwin-arm64
            token: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build the openXC7 package
        env:
          OPENXC7_PACK_DATE: ${{ needs.prepare.outputs.date }}
        run: |
          nix develop --command bash -c 'python3.12 openxc7-pack.py'
          ls -la apio-openxc7-${{ matrix.token }}-*.tgz

      - name: Publish the ${{ matrix.token }} asset to the dated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.prepare.outputs.date }}" \
            apio-openxc7-${{ matrix.token }}-*.tgz \
            --repo "$GITHUB_REPOSITORY" --clobber
