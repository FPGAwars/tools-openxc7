# F4 — build the openXC7 package natively per OS and publish both assets to the
# same dated GitHub release (linux-x86-64 + darwin-arm64), so they coexist.
#
# Native build only — nixpkgs does not support cross Linux<->macOS, so each
# package is built on its own runner. The package date is forced via
# OPENXC7_PACK_DATE so the tarball name/VERSION match the release tag.
name: release

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Release date YYYY-MM-DD (default: today, UTC)"
        required: false
  push:
    tags:
      - '20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]'   # dated tags, e.g. 2026-06-20

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.d.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            DATE="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE="$(date -u +%Y-%m-%d)"
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Release date: $DATE"
          # Create the release once here (no race between the build jobs).
          gh release view "$DATE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$DATE" --repo "$GITHUB_REPOSITORY" \
              --title "$DATE" --notes "openXC7 toolchain — $DATE"

  # Linux first: it generates every chipdb .bin of chipdb-parts.json and
  # shares them as an artifact. The .bin is platform-independent, and the
  # macos-14 runner (7 GB RAM) cannot regenerate the big parts (xc7a200t).
  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build the openXC7 package
        env:
          OPENXC7_PACK_DATE: ${{ needs.prepare.outputs.date }}
        run: |
          nix develop .#pack --command bash -c 'python3.12 openxc7-pack.py'
          ls -la apio-openxc7-linux-x86-64-*.tgz

      - name: Publish the linux-x86-64 asset to the dated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.prepare.outputs.date }}" \
            apio-openxc7-linux-x86-64-*.tgz \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Share the chipdb bins with the darwin job
        uses: actions/upload-artifact@v4
        with:
          name: chipdb-bins
          path: dist/chipdb/*.bin
          compression-level: 1     # already dense binary data
          retention-days: 7        # allow re-running build-darwin days later

  build-darwin:
    needs: [prepare, build-linux]
    runs-on: macos-14              # Apple Silicon => darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Reuse the linux-built chipdb bins
        uses: actions/download-artifact@v4
        with:
          name: chipdb-bins
          path: chipdb-seed

      - name: Build the openXC7 package
        env:
          OPENXC7_PACK_DATE: ${{ needs.prepare.outputs.date }}
          OPENXC7_CHIPDB_SEED: ${{ github.workspace }}/chipdb-seed
        run: |
          nix develop .#pack --command bash -c 'python3.12 openxc7-pack.py'
          ls -la apio-openxc7-darwin-arm64-*.tgz

      - name: Publish the darwin-arm64 asset to the dated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.prepare.outputs.date }}" \
            apio-openxc7-darwin-arm64-*.tgz \
            --repo "$GITHUB_REPOSITORY" --clobber
