# Release pipeline v2 — thin orchestrator.
#
# Every platform is built and validated by its OWN reusable workflow, on its
# own native runner (windows is cross-built from linux; nixpkgs cannot cross
# Linux<->macOS, and Nix does not run on Windows):
#
#   linux-package.yml    ubuntu-latest   native   (also owns the chipdb)
#   darwin-package.yml   macos-14        native   (seeded from linux)
#   windows-package.yml  ubuntu-latest   cross    (validated under wine)
#
# Each carries its own gate, so the exact same build+validation runs whether
# you dispatch it standalone or through a release. This workflow only picks
# the date, wires the chipdb seed, and — if EVERYTHING is green — publishes.
#
# The release is created at the END, as an idempotent dated PRERELEASE
# (never latest). Any red aborts with no release; the build artifacts stay
# downloadable for debugging. Promotion to a real (latest) release is a
# manual, human step:
#   gh release edit <date> --prerelease=false --latest
name: release

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Release date YYYY-MM-DD (default: today, UTC)"
        required: false
  push:
    tags:
      - '20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]'   # dated tags, e.g. 2026-06-20

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The date is resolved ONCE here and passed down: apio derives the asset
  # date from the release TAG, so tag and every asset name must match.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.d.outputs.date }}
    steps:
      - id: d
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            DATE="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE="$(date -u +%Y-%m-%d)"
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Release date: $DATE"

  linux:
    needs: prepare
    uses: ./.github/workflows/linux-package.yml
    with:
      date: ${{ needs.prepare.outputs.date }}

  # After linux: it publishes the chipdb-bins artifact this job seeds from.
  darwin:
    needs: [prepare, linux]
    uses: ./.github/workflows/darwin-package.yml
    with:
      date: ${{ needs.prepare.outputs.date }}
      seed_from_artifact: true

  windows:
    needs: prepare
    uses: ./.github/workflows/windows-package.yml
    with:
      date: ${{ needs.prepare.outputs.date }}

  publish:
    needs: [prepare, linux, darwin, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apio-openxc7-*     # the 3 package artifacts (not chipdb-bins)
          merge-multiple: true

      - name: Assert the chipdb is byte-identical linux<->windows
        run: |
          mkdir lin win
          tar xzf apio-openxc7-linux-x86-64-*.tgz -C lin
          tar xzf apio-openxc7-windows-amd64-*.tgz -C win
          n=0
          for f in lin/chipdb/*.bin; do
            b=$(basename "$f")
            cmp "$f" "win/chipdb/$b" || { echo "chipdb differs: $b"; exit 1; }
            n=$((n + 1))
          done
          echo "chipdb parity OK ($n bins byte-identical)"
          rm -rf lin win

      - name: Create the dated prerelease (never latest) and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ needs.prepare.outputs.date }}
        run: |
          ls -la apio-openxc7-*.tgz
          # every asset must carry the tag's date, or apio 404s at install
          for f in apio-openxc7-*.tgz; do
            case "$f" in
              *"-${DATE//-/}.tgz") ;;
              *) echo "::error::asset $f is not dated ${DATE//-/}"; exit 1 ;;
            esac
          done
          sha256sum apio-openxc7-*.tgz > SHA256SUMS
          cat SHA256SUMS
          gh release view "$DATE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$DATE" --repo "$GITHUB_REPOSITORY" \
              --title "$DATE" --prerelease --latest=false \
              --notes "openXC7 toolchain — $DATE (release candidate: validated by CI, pending manual promotion)"
          gh release upload "$DATE" apio-openxc7-*.tgz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

      # Promotion stays a human decision; these are the steps it involves,
      # including the pin bumps that keep installers and apio aligned with
      # what is actually published (scripts/check-pins.sh asserts it).
      - name: Promotion checklist
        env:
          DATE: ${{ needs.prepare.outputs.date }}
        run: |
          {
            echo "## Release candidate \`$DATE\` published (prerelease, not latest)"
            echo
            echo "To promote it:"
            echo
            echo "1. Try it for real (\`apio\` install from the tag, board test if it applies)."
            echo "2. \`gh release edit $DATE --prerelease=false --latest\`"
            echo "3. Bump \`OPENXC7_DATE\` in \`lib/common.sh\` to \`$DATE\`."
            echo "4. Bump the \`openxc7\` tag in apio's \`remote-config/apio-1.5.x.jsonc\`."
            echo "5. \`scripts/check-pins.sh\` must come back green."
          } >> "$GITHUB_STEP_SUMMARY"
