# Per-commit checks: the build.py tests and the shell scripts' syntax.
name: test

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Test build.py
        run: |
          pip install pytest
          python -m pytest tests

      - name: Check the shell scripts' syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
