# Per-commit compile test (ecosystem convention: named `test`, like the
# other apio packages — zapta 2026-08-09).
#
# Three INDEPENDENT native-compile jobs, one per shipped architecture (no
# cross Linux<->macOS in nixpkgs; windows is a mingw cross FROM linux):
#
#   linux    x86_64-linux    ubuntu-22.04  nextpnr-xilinx / prjxray / fasm
#   macos    aarch64-darwin  macos-14      nextpnr-xilinx / prjxray / fasm
#   windows  mingw cross     ubuntu-22.04  nextpnr.exe / prjxray .exe tools
#                                          (passthru outputs of the tools
#                                          tree — the chipdb is generated
#                                          once by chipdb.yml and injected
#                                          into the package by CI)
#
# Plus `static`: everything that needs no toolchain at all (unit tests, shell
# syntax, the workflow graph, the terminology rule). It runs in a minute next
# to the three builds, and it covers the failures that used to be found in a
# release run — an input a reusable workflow does not accept, an artifact name
# nobody uploads: Actions treats both as empty rather than as errors.
#
# Go/nogo: a green job IS the report (no step summaries). The full package
# assembly + L1/L2 validation runs in build-pre-release nightly.
name: test

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (x86_64-linux)
    runs-on: ubuntu-22.04            # ecosystem runner version (apio hit issues on 24.04; see apio build-linux-x86-64.yaml)
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false          # no branded gantt/Discord footer
          diagnostic-endpoint: ""   # no telemetry

      - name: Evaluate the flake (exercises the platform guards)
        run: nix flake show --all-systems

      - name: Build nextpnr-xilinx
        run: nix build -L .#nextpnr-xilinx

      - name: Build prjxray
        run: nix build -L .#prjxray

      - name: Build fasm
        run: nix build -L .#fasm

  macos:
    name: macos (aarch64-darwin)
    runs-on: macos-14            # Apple Silicon runner => aarch64-darwin
    # HARD gate since 2026-08-06: the F0-era "exploratory, continue-on-error"
    # relaxation let the very first public run show GREEN while nextpnr
    # failed to compile (impure Python.h). macOS is a first-class platform;
    # a red build must be a red job.
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false          # no branded gantt/Discord footer
          diagnostic-endpoint: ""   # no telemetry

      - name: Flake evaluates on darwin
        run: nix flake show

      # One step per derivation so a failure names its culprit directly.
      - name: Build nextpnr-xilinx
        run: nix build -L .#nextpnr-xilinx

      - name: Build prjxray
        run: nix build -L .#prjxray

      - name: Build fasm
        run: nix build -L .#fasm

  windows:
    name: windows (mingw cross from x86_64-linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false          # no branded gantt/Discord footer
          diagnostic-endpoint: ""   # no telemetry

      # The tools output and its passthru attributes never depend on chipdb.
      # Keep the one-step-per-culprit layout used by the native jobs.
      - name: Build nextpnr-xilinx.exe (mingw)
        run: nix build -L .#packages.x86_64-linux.openxc7-windows-amd64-tools.nextpnr

      - name: Build prjxray tools .exe (mingw)
        run: nix build -L .#packages.x86_64-linux.openxc7-windows-amd64-tools.prjxray

  static:
    name: static (no toolchain)
    # Not the ecosystem's ubuntu-22.04: nothing here is built or linked, so
    # this job wants the fastest runner rather than a matching one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # An interpreter of our own: the runner's system python is externally
      # managed (PEP 668) and refuses pip install.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The only dependencies of this job. Fixed versions: a checker that
      # changes behaviour on its own is a checker nobody trusts.
      - name: Install the test and YAML tooling
        run: python3 -m pip install --quiet pytest==8.3.4 pyyaml==6.0.2

      - name: Unit tests (pack/, the packer's rules, the release gate)
        run: python3 -m pytest tests/ -q

      - name: Shell syntax
        run: bash -n scripts/*.sh e2e/*.sh

      # An input a called workflow does not declare is IGNORED by Actions,
      # and needs.<job>.outputs.<typo> evaluates to the empty string: both
      # surface hours into a release build, or not at all.
      - name: Workflow interfaces (inputs and outputs)
        run: scripts/check-workflows.py

      # A download whose name nothing uploads finds nothing and fails later
      # with a missing file (the seed_from_artifact rename, 2026-08).
      - name: Artifact producers and consumers
        run: scripts/check-artifacts.py

      # apio#924: the pad-vs-version wording rule.
      - name: Terminology
        run: scripts/check-terminology.sh
