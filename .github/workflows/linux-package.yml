# Build + validate the linux-x86-64 package on its native runner.
#
# Reusable (workflow_call) and standalone (workflow_dispatch): release.yml
# calls it; a developer can also dispatch it to get a validated package of
# any branch without running the whole release. No push trigger on purpose —
# packing is expensive (it is a deliverable, not a guard); the push guards
# are test.yaml and the nightly build-pre-release.
#
# The chipdb is NOT generated here: chipdb.yml owns it (generated once,
# platform-independent). Orchestrated from build-pre-release this job seeds
# from the run's `chipdb-bins` artifact; standalone it seeds from the shared
# revision-keyed cache and only regenerates on a cache miss.
name: linux-package

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Package date YYYY-MM-DD (default: today, UTC)"
        required: false
  workflow_call:
    inputs:
      date:
        description: "Package date YYYY-MM-DD (default: today, UTC)"
        required: false
        type: string
      yosys_release_tag:
        description: "Upstream YosysHQ oss-cad-suite release this package expects at runtime (BUILD-INFO matching key)"
        required: false
        default: ""
        type: string
      seed_from_artifact:
        description: "Take the chipdb from the chipdb-bins artifact of this run (release flow)"
        required: false
        default: false
        type: boolean
      chipdb_source:
        description: "How the chipdb job obtained the bins (generated | restored-from-cache); recorded in BUILD-INFO. Standalone runs derive it themselves."
        required: false
        default: ""
        type: string
      chipdb_id:
        description: "chipdb identity stamp of the seeded bins; recorded in BUILD-INFO"
        required: false
        default: ""
        type: string
    outputs:
      tarball:
        description: "Name of the built tarball"
        value: ${{ jobs.build.outputs.tarball }}

jobs:
  build:
    name: build + validate linux-x86-64 (native)
    runs-on: ubuntu-22.04            # ecosystem runner version (apio hit issues on 24.04; see apio build-linux-x86-64.yaml)
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false          # no branded gantt/Discord footer
          diagnostic-endpoint: ""   # no telemetry

      - name: Resolve the package date
        id: d
        run: |
          DATE="${{ inputs.date }}"
          [ -n "$DATE" ] || DATE=$(date -u +%Y-%m-%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "dateid=${DATE//-/}" >> "$GITHUB_OUTPUT"
          echo "Package date: $DATE"

      - name: Seed the chipdb from the chipdb job of this run
        if: inputs.seed_from_artifact
        uses: actions/download-artifact@v8
        with:
          name: chipdb-bins
          path: chipdb-cache

      # Standalone runs reuse the cache chipdb.yml populated (caches are
      # shared across workflows of the repo). KEEP THE FILE LIST IN SYNC
      # with chipdb.yml and darwin-package.yml.
      - name: Seed the chipdb from the shared cache (standalone)
        if: ${{ !inputs.seed_from_artifact }}
        uses: actions/cache/restore@v6
        with:
          path: chipdb-cache
          key: chipdb-v1-${{ hashFiles('nix/nextpnr-xilinx.nix', 'nix/prjxray.nix', 'nix/nextpnr-xilinx-chipdb.nix', 'chipdb-parts.json') }}

      # Installed BEFORE composing BUILD-INFO: build-info.sh re-exports the
      # yosys-release-tag from the installed package's own BUILD-INFO.json
      # (the runtime matching key, apio#927).
      - name: Cache the oss-cad-suite validation env
        uses: actions/cache@v6
        with:
          path: ~/.local/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ hashFiles('scripts/ci-install-oss-cad-suite.sh') }}

      - name: Install oss-cad-suite (the user env, via our own installer)
        run: |
          [ -x "$HOME/.local/oss-cad-suite/bin/yosys" ] || bash scripts/ci-install-oss-cad-suite.sh
          # the validation env must BE the declared runtime expectation (apio#927)
          DECLARED="${{ inputs.yosys_release_tag }}"
          if [ -n "$DECLARED" ]; then
            GOT=$(python3 -c "import json;print(json.load(open('$HOME/.local/oss-cad-suite/BUILD-INFO.json')).get('yosys-release-tag','?'))" 2>/dev/null || echo "?")
            if [ "$GOT" != "$DECLARED" ]; then
              echo "::error::validation env yosys release ($GOT) != declared yosys_release_tag ($DECLARED)"
              exit 1
            fi
          fi

      # chipdb provenance for BUILD-INFO (apio#940 follow-up): orchestrated
      # runs get it from the chipdb job; a standalone run seeds from the
      # shared cache when it hits (else linux regenerates, darwin stops).
      - name: Compose BUILD-INFO.json (ecosystem convention)
        env:
          YOSYS_RELEASE_TAG: ${{ inputs.yosys_release_tag }}
          CHIPDB_SOURCE_IN: ${{ inputs.chipdb_source }}
          CHIPDB_ID_IN: ${{ inputs.chipdb_id }}
        run: |
          if [ -n "$CHIPDB_SOURCE_IN" ]; then
            export CHIPDB_SOURCE="$CHIPDB_SOURCE_IN"
          elif [ -n "$(ls chipdb-cache/*.bin 2>/dev/null || true)" ]; then
            export CHIPDB_SOURCE=restored-from-cache
          else
            export CHIPDB_SOURCE=generated
          fi
          if [ -n "$CHIPDB_ID_IN" ]; then
            export CHIPDB_ID="$CHIPDB_ID_IN"
          elif [ -f chipdb-cache/chipdb-id.txt ]; then
            export CHIPDB_ID=$(cat chipdb-cache/chipdb-id.txt)
          fi
          DATE="${{ steps.d.outputs.date }}"
          bash scripts/build-info.sh linux-x86-64 "$DATE" \
            "apio-openxc7-linux-x86-64-${DATE//-/}.tgz" BUILD-INFO.json

      - name: Build the openXC7 package
        id: pack
        env:
          OPENXC7_PACK_DATE: ${{ steps.d.outputs.date }}
          OPENXC7_BUILD_INFO: ${{ github.workspace }}/BUILD-INFO.json
        run: |
          # stale-dist guard: only the version-keyed cache may seed the chipdb
          # (a dist/ from another toolchain revision ships bins with
          # mismatched constids)
          rm -rf dist
          if [ -n "$(ls -A chipdb-cache 2>/dev/null || true)" ]; then
            export OPENXC7_CHIPDB_SEED="$PWD/chipdb-cache"
            echo "chipdb: seeding from cache ($(ls chipdb-cache/*.bin | wc -l) bins)"
          else
            echo "chipdb: cache miss, generating from scratch (slow)"
          fi
          nix develop .#pack --command bash -c 'python3.12 openxc7-pack.py'
          TGZ=$(ls apio-openxc7-linux-x86-64-*.tgz)
          echo "tarball=$TGZ" >> "$GITHUB_OUTPUT"
          ls -la "$TGZ"

      - name: Validate the package inside the tarball (L1 gate)
        run: |
          export PATH="$HOME/.local/oss-cad-suite/bin:$PATH"
          bash scripts/validate-package.sh "${{ steps.pack.outputs.tarball }}" \
            --expect-date "${{ steps.d.outputs.dateid }}"

      # Same environment as L1 (the user env): the baselines carry the tool
      # versions they were recorded with, so a different yosys would drown
      # the report in version-mismatch warnings.
      - name: Fetch the locked third-party trees (regress/lock.json)
        run: bash scripts/fetch-demos.sh

      - name: Regression suite against the tarball (L2 gate)
        run: |
          export PATH="$HOME/.local/oss-cad-suite/bin:$PATH"
          bash scripts/regress.sh "${{ steps.pack.outputs.tarball }}" \
            --json regress-report.json --markdown regress-report.md

      - name: Publish the regression report in the job summary
        if: always()
        run: |
          [ -f regress-report.md ] && cat regress-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regress-report-linux-x86-64
          path: regress-report.*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: apio-openxc7-linux-x86-64
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

