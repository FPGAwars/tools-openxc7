# Makes a pre-release stable, by hand (Actions -> make-pre-release-stable ->
# Run workflow): checks its assets the way apio fetches them
# (scripts/asset-check.sh), marks it stable and removes the pre-release
# note from its text. The `latest` input also makes it the repo's latest
# release. apio's remote-config is updated by hand in the apio repo.

name: make-pre-release-stable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to make stable (YYYY-MM-DD)"
        required: true
      full:
        description: "Download the three packages and check their sha256"
        required: false
        default: true
        type: boolean
      latest:
        description: "Also make it the repo's latest release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  make-stable:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Check the release assets
        run: |
          bash scripts/asset-check.sh "${{ inputs.tag }}" ${{ inputs.full && '--full' || '' }}

      # --latest is always passed: without it, gh makes the edited release
      # the latest one.
      - name: Mark the release stable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          LATEST: ${{ inputs.latest }}
        run: |
          gh release edit "$TAG" --prerelease=false --latest="$LATEST"

      - name: Remove the pre-release note
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --json body --jq .body | sed '/^### Pre-release note/,$d' > notes.md
          gh release edit "$TAG" --notes-file notes.md
