# Build + validate the Windows package. The flake produces only the tools
# tree; this workflow copies the chipdb bins and chipdb-id.txt from the
# chipdb.yml artifact into chipdb/, embeds the XILINX-PARTS-INDEX document
# that job wrote, and validates the assembled tarball under Wine. Schema 8
# ships those bins inside the package (apio#1070). The .exe is the
# himbaechel xilinx uarch without an embedded Python: `apio report` reads
# its --report JSON, the same on every platform. See nix/windows/.
name: windows-package

on:
  workflow_call:
    inputs:
      date:
        description: "Package date YYYY-MM-DD (the release tag; apio derives the asset date from it)"
        required: true
        type: string
      yosys_release_tag:
        description: "Upstream YosysHQ oss-cad-suite release this package expects at runtime (BUILD-INFO matching key)"
        required: true
        type: string
      chipdb_source:
        description: "How the chipdb job obtained the bins (generated | restored-from-cache); recorded in BUILD-INFO"
        required: true
        type: string
      chipdb_id:
        description: "Expected chipdb identity stamp from the chipdb job; checked against the downloaded bins and recorded in BUILD-INFO"
        required: true
        type: string
      parts_index:
        description: "Filename of the XILINX-PARTS-INDEX document in the parts-index artifact"
        required: true
        type: string

jobs:
  # The chipdb-bins and parts-index artifacts come from the chipdb.yml job of
  # the calling run (build-pre-release.yaml); this job only consumes them.
  build:
    name: build + validate windows-amd64 (cross from linux)
    runs-on: ubuntu-22.04            # ecosystem runner version (apio hit issues on 24.04; see apio build-linux-x86-64.yaml)
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false          # no branded gantt/Discord footer
          diagnostic-endpoint: ""   # no telemetry

      # Copied into package-win/chipdb/ below and shipped in the tarball.
      - name: Download the verified chipdb bins
        uses: actions/download-artifact@v8
        with:
          name: chipdb-bins
          path: chipdb-bins

      - name: Download the XILINX-PARTS-INDEX document
        uses: actions/download-artifact@v8
        with:
          name: parts-index
          path: parts-index

      - name: Build the Windows tools tree (flake output)
        run: |
          nix build -L \
            '.#packages.x86_64-linux.openxc7-windows-amd64-tools' --out-link result-win-tools
          test ! -e result-win-tools/chipdb
          test -f result-win-tools/bin/nextpnr-xilinx.exe
          test -f result-win-tools/bin/xc7frames2bit.exe
          # the mingw runtime sits next to the .exe (no rpath on Windows)
          for dll in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll libmcfgthread-1.dll; do
            test -f "result-win-tools/bin/$dll" || { echo "::error::tools tree lacks bin/$dll"; exit 1; }
          done
          # built with BUILD_PYTHON=OFF: no embedded interpreter, no stdlib
          # for it, and none of the python helpers the old engine installed
          test ! -e result-win-tools/bin/libpython3.11.dll
          test ! -e result-win-tools/lib/python3.11
          test ! -e result-win-tools/share/nextpnr/python
          test -f result-win-tools/lib/python3.12/site-packages/fasm/__init__.py
          test -f result-win-tools/share/nextpnr/external/prjxray-db/artix7/settings.sh
          test -f result-win-tools/bin/xc7pll.cmd
          echo "tools tree shape OK; chipdb and embedded python absent"

      - name: Assemble a writable package tree (chipdb + XILINX-PARTS-INDEX)
        run: |
          cp -aL result-win-tools package-win
          chmod -R u+w package-win

          # The nix output is tools-only. The bins go in chipdb/, the same
          # place the linux and darwin packer seeds them, and they ship.
          mkdir -p package-win/chipdb

          # The artifact must be the right one: one chipdb-<die>.bin per die
          # of the manifest (the packer's rule, pack.families.chipdb_dies),
          # with the identity the caller declared.
          python3 -c 'from pack.families import chipdb_dies; from pack.chipdb import chipdb_file; print("\n".join(chipdb_file(die) for _, die in chipdb_dies()))' > /tmp/chipdb-files.txt
          test -s /tmp/chipdb-files.txt
          while read -r f; do
            test -f "chipdb-bins/$f" || { echo "::error::chipdb artifact missing $f"; exit 1; }
          done < /tmp/chipdb-files.txt
          for f in chipdb-bins/*.bin; do
            grep -Fxq "$(basename "$f")" /tmp/chipdb-files.txt \
              || { echo "::error::unexpected chipdb artifact member: $f"; exit 1; }
          done
          EXPECTED=$(wc -l < /tmp/chipdb-files.txt)
          ACTUAL=$(find chipdb-bins -maxdepth 1 -type f -name '*.bin' | wc -l)
          [ "$ACTUAL" -eq "$EXPECTED" ] || { echo "::error::chipdb artifact has $ACTUAL bins, expected $EXPECTED"; exit 1; }
          test -s chipdb-bins/chipdb-id.txt
          ARTIFACT_ID=$(cat chipdb-bins/chipdb-id.txt)
          DECLARED_ID="${{ inputs.chipdb_id }}"
          [ "$DECLARED_ID" = "$ARTIFACT_ID" ] \
            || { echo "::error::chipdb artifact identity ($ARTIFACT_ID) differs from the caller's chipdb_id ($DECLARED_ID)"; exit 1; }
          cp chipdb-bins/*.bin chipdb-bins/chipdb-id.txt package-win/chipdb/
          test ! -e package-win/chipdb/README.txt
          echo "$ACTUAL chipdb bins copied into the package (identity $ARTIFACT_ID)"

          # The same index the linux and darwin packages embed, under the
          # stable in-package name; L1 checks the packaged bins against it.
          INDEX="parts-index/${{ inputs.parts_index }}"
          test -f "$INDEX" || { echo "::error::XILINX-PARTS-INDEX not in the artifact: $INDEX"; exit 1; }
          cp "$INDEX" package-win/XILINX-PARTS-INDEX.json
          echo "embedded $(basename "$INDEX") as XILINX-PARTS-INDEX.json"
          df -h . | tail -1

      # Installed BEFORE the tar step: build-info.sh re-exports the
      # yosys-release-tag from the installed package's own BUILD-INFO.json
      # (the runtime matching key, apio#927).
      - name: Cache the oss-cad-suite validation env
        uses: actions/cache@v6
        with:
          path: ~/.local/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ hashFiles('scripts/ci-install-oss-cad-suite.sh') }}

      - name: Install oss-cad-suite (the user env, via our own installer)
        run: |
          [ -x "$HOME/.local/oss-cad-suite/bin/yosys" ] || bash scripts/ci-install-oss-cad-suite.sh
          # the validation env must BE the declared runtime expectation (apio#927)
          DECLARED="${{ inputs.yosys_release_tag }}"
          GOT=$(python3 -c "import json;print(json.load(open('$HOME/.local/oss-cad-suite/BUILD-INFO.json')).get('yosys-release-tag','?'))" 2>/dev/null || echo "?")
          [ "$GOT" = "$DECLARED" ] \
            || { echo "::error::validation env yosys release ($GOT) != declared yosys_release_tag ($DECLARED)"; exit 1; }

      - name: Tar with date
        id: tar
        run: |
          # same convention as linux-package/darwin-package: YYYY-MM-DD in,
          # YYYYMMDD in the asset name (what apio derives from the tag)
          DATE="${{ inputs.date }}"
          NAME="apio-openxc7-windows-amd64-${DATE//-/}.tgz"
          # provenance comes from the chipdb job of the calling run
          CHIPDB_SOURCE_IN="${{ inputs.chipdb_source }}"
          # the identity is the stamp that ships next to the bins
          ARTIFACT_ID=$(cat package-win/chipdb/chipdb-id.txt)
          YOSYS_RELEASE_TAG="${{ inputs.yosys_release_tag }}" \
          CHIPDB_SOURCE="$CHIPDB_SOURCE_IN" CHIPDB_ID="$ARTIFACT_ID" \
            bash scripts/build-info.sh windows-amd64 "$DATE" "$NAME" package-win/BUILD-INFO.json
          # --mode=u+w: the nix store tree is read-only; without it Windows
          # extracts the files with the READONLY attribute and apio cannot
          # delete/reinstall the package (PermissionError on --force/upgrade)
          tar czhf "$NAME" --mode=u+w -C package-win .
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "dateid=${DATE//-/}" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - name: Smoke — run the .exe under wine + import the python tools
        run: |
          # shellcheck disable=SC2016 # variables expand in the inner Bash
          nix shell --inputs-from . nixpkgs#wine64 nixpkgs#python312 -c bash -euo pipefail -c '
            export WINEPREFIX="$PWD/.wine" WINEDEBUG=-all
            wine64 package-win/bin/nextpnr-xilinx.exe --help | head -3
            wine64 package-win/bin/xc7frames2bit.exe --help 2>&1 | head -2 || true
            echo "=== import fasm (pure-python textX fallback) ==="
            PYTHONPATH=package-win/lib/python3.12/site-packages \
              python3 -c "import fasm, prjxray; print(\"fasm/prjxray import OK\")"
            echo "=== same imports under a WINDOWS python (the real apio path) ==="
            # on real Windows fasm2frames runs with the oss-cad-suite Windows
            # python, not a POSIX one: catch POSIX-only imports (e.g. fcntl)
            WINPY=$(ls -d /nix/store/*-python3-x86_64-w64-mingw32-* 2>/dev/null | grep -v .drv | head -1 || true)
            # NOTE: no single quotes in here — this whole script IS a
            # single-quoted string; a nested quote hands the rest of the file
            # to the OUTER shell (wine64: command not found, exit 127 — the
            # first public CI run caught exactly that).
            [ -z "$WINPY" ] && WINPY=$(nix build --print-out-paths --no-link \
              --inputs-from . "nixpkgs#pkgsCross.mingwW64.python311" 2>/dev/null | head -1 || true)
            if [ -n "$WINPY" ] && [ -x "$WINPY/bin/python3.exe" ]; then
              wine64 "$WINPY/bin/python3.exe" -c "import sys; sys.path.insert(0, \"package-win/lib/python3.12/site-packages\"); import prjxray.util, prjxray.fasm_assembler, fasm; print(\"windows-python imports OK\")"
            else
              echo "WARNING: mingw python not found; windows-python import check skipped"
            fi
          '

      - name: E2E — synth (yosys) -> nextpnr.exe -> fasm2frames -> xc7frames2bit.exe
        run: |
          # shellcheck disable=SC2016 # variables expand in the inner Bash
          nix shell --inputs-from . nixpkgs#wine64 nixpkgs#yosys nixpkgs#python312 -c bash -euo pipefail -c '
            export WINEPREFIX="$PWD/.wine" WINEDEBUG=-all
            PKG=package-win
            DB=$PKG/share/nextpnr/external/prjxray-db/artix7
            mkdir -p run && cd run
            yosys -q -p "synth_xilinx -arch xc7 -top ledon; write_json ledon.json" ../example/ledon.v
            # The command line apio runs for a schema 8 package: the part in
            # --device, the chipdb of its die (the file inside this package),
            # the XDC and the FASM as -o options, and --report, whose JSON
            # is what apio report reads.
            # stdin from /dev/null and stdout through a pipe: wine wants
            # valid handles, not a detached terminal.
            wine64 ../$PKG/bin/nextpnr-xilinx.exe --device xc7a35tcpg236-1 \
              --chipdb ../$PKG/chipdb/chipdb-xc7a50t.bin \
              -o xdc=../config/basys3.xdc --json ledon.json \
              -o fasm=ledon.fasm --report ledon.report.json </dev/null 2>&1 | cat
            python3 - ledon.report.json <<"PYEOF"
          import json, sys
          report = json.load(open(sys.argv[1]))
          missing = [key for key in ("fmax", "utilization") if key not in report]
          if missing or not report["utilization"]:
              raise SystemExit("--report lacks " + str(missing or ["a non-empty utilization"]))
          print("--report OK:", len(report["utilization"]), "bel types, fmax", report["fmax"])
          PYEOF
            echo "✅ parity: --report carries fmax and utilization -> apio report works"
            # nextpnr.exe writes CRLF: drop the CR like e2e/run-parts.sh does
            grep -v "^\s*#" ledon.fasm | sed "/^\s*$/d" | tr -d "\r" | LC_ALL=C sort > ledon.fasm.canon
            # fasm2frames exactly like apio on real Windows: the WINDOWS
            # python + a shell redirect (catches POSIX-isms like /dev/stdout)
            WINPY=$(ls -d /nix/store/*-python3-x86_64-w64-mingw32-* 2>/dev/null | grep -v .drv | head -1 || true)
            if [ -n "$WINPY" ] && [ -x "$WINPY/bin/python3.exe" ]; then
              # mingw python under wine dies if stdout is a FILE (WinError 6,
              # init_sys_streams) — it needs a pipe; cat writes the file.
              PYTHONPATH=../$PKG/lib/python3.12/site-packages \
                wine64 "$WINPY/bin/python3.exe" ../$PKG/libexec/fasm2frames \
                --part xc7a35tcpg236-1 --db-root ../$DB ledon.fasm </dev/null | cat > ledon.frames
              echo "fasm2frames ran under the WINDOWS python"
            else
              PYTHONPATH=../$PKG/lib/python3.12/site-packages \
                python3 ../$PKG/libexec/fasm2frames --part xc7a35tcpg236-1 --db-root ../$DB \
                ledon.fasm > ledon.frames
              echo "WARNING: mingw python not found; used host python for fasm2frames"
            fi
            test -s ledon.frames
            wine64 ../$PKG/bin/xc7frames2bit.exe \
              --part_file ../$DB/xc7a35tcpg236-1/part.yaml --part_name xc7a35tcpg236-1 \
              --frm_file ledon.frames --output_file ledon.bit
            ls -la ledon.bit && echo "✅ E2E: bitstream generated by the Windows toolchain"
          '

      - name: Validate the assembled tarball under Wine (L1 gate)
        run: |
          # shellcheck disable=SC2016 # variables expand in the inner Bash
          nix shell --inputs-from . nixpkgs#wine64 -c bash -euo pipefail -c '
            export WINEPREFIX="$PWD/.wine" WINEDEBUG=-all
            export PATH="$HOME/.local/oss-cad-suite/bin:$PATH"
            E2E_WINPY=$(ls -d /nix/store/*-python3-x86_64-w64-mingw32-* 2>/dev/null | grep -v .drv | head -1 || true)
            [ -n "$E2E_WINPY" ] && [ -x "$E2E_WINPY/bin/python3.exe" ] \
              || { echo "mingw Python required for the Windows package gate"; exit 1; }
            export E2E_WINPY
            bash scripts/validate-package.sh "${{ steps.tar.outputs.name }}" --wine \
              --expect-date "${{ steps.tar.outputs.dateid }}"
          '

      # The exe-parity design checks that used to live inline here (virtual
      # clock warns + fmax getter, hierarchical merge_nets, wide-mux clock
      # table) are the regression tests vclk, hier and widemux — the L2 run
      # below exercises them and the whole catalogue against the tarball,
      # with fasm2frames under the WINDOWS python (the real apio path; the
      # harness finds the mingw interpreter in the store, E2E_WINPY overrides).
      - name: Fetch the locked third-party trees (regress/lock.json)
        run: bash scripts/fetch-demos.sh

      - name: Regression suite against the tarball under wine (L2 gate)
        run: |
          # shellcheck disable=SC2016 # variables expand in the inner Bash
          nix shell --inputs-from . nixpkgs#wine64 -c bash -euo pipefail -c '
            export WINEPREFIX="$PWD/.wine" WINEDEBUG=-all
            export PATH="$HOME/.local/oss-cad-suite/bin:$PATH"
            E2E_WINPY=$(ls -d /nix/store/*-python3-x86_64-w64-mingw32-* 2>/dev/null | grep -v .drv | head -1 || true)
            [ -n "$E2E_WINPY" ] && export E2E_WINPY
            bash scripts/regress.sh "${{ steps.tar.outputs.name }}" \
              --json regress-report.json --markdown regress-report.md
          '

      - name: Publish the regression report in the job summary
        if: always()
        run: |
          [ -f regress-report.md ] && cat regress-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regress-report-windows-amd64
          path: regress-report.*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: apio-openxc7-windows-amd64
          path: ${{ steps.tar.outputs.name }}
          if-no-files-found: error
