# Reproducible build + validation of the Windows package, fully in CI (the
# ubuntu runner has github access, so the flake's fetchFromGitHub works here).
# Builds the flake output, tars it with the date, validates the toolchain under
# wine end-to-end (yosys synth -> nextpnr-xilinx.exe -> fasm2frames -> bit) and
# uploads the .tgz artifact. See nix/windows/.
name: windows-package

on:
  workflow_dispatch:
  push:
    branches: [ main, "feat/**" ]
    paths:
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'chipdb-parts.json'

jobs:
  build:
    name: build + validate windows-amd64 (cross from linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build the Windows package tree (flake output)
        run: |
          nix build -L \
            '.#packages.x86_64-linux.openxc7-windows-amd64' --out-link result-win
          echo "=== tree ==="; find result-win/ -maxdepth 2 | sort
          echo "=== bin ==="; ls -la result-win/bin
          echo "=== site-packages ==="; ls result-win/lib/python3.12/site-packages
          echo "=== chipdb (every artix7 part of chipdb-parts.json must ship) ==="
          # the windows package ships the artix7 family only (its prjxray-db
          # is the only one packaged); a separate step so a jq failure cannot
          # pass vacuously
          jq -r '.artix7[]' chipdb-parts.json > /tmp/chipdb-parts.txt
          test -s /tmp/chipdb-parts.txt
          while read -r p; do
            test -f "result-win/chipdb/$p.bin" || { echo "MISSING $p.bin"; exit 1; }
            ls -la "result-win/chipdb/$p.bin"
          done < /tmp/chipdb-parts.txt

      - name: Tar with date
        id: tar
        run: |
          DATE=$(date -u +%Y%m%d)
          NAME="apio-openxc7-windows-amd64-$DATE.tgz"
          # --mode=u+w: the nix store tree is read-only; without it Windows
          # extracts the files with the READONLY attribute and apio cannot
          # delete/reinstall the package (PermissionError on --force/upgrade)
          tar czhf "$NAME" --mode=u+w -C result-win .
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - name: Smoke — run the .exe under wine + import the python tools
        run: |
          nix shell nixpkgs#wine64 nixpkgs#python312 -c bash -euo pipefail -c '
            export WINEPREFIX="$PWD/.wine" WINEDEBUG=-all
            wine64 result-win/bin/nextpnr-xilinx.exe --help | head -3
            wine64 result-win/bin/xc7frames2bit.exe --help 2>&1 | head -2 || true
            echo "=== import fasm (pure-python textX fallback) ==="
            PYTHONPATH=result-win/lib/python3.12/site-packages \
              python3 -c "import fasm, prjxray; print(\"fasm/prjxray import OK\")"
            echo "=== same imports under a WINDOWS python (the real apio path) ==="
            # on real Windows fasm2frames runs with oss-cad-suite's Windows
            # python, not a POSIX one: catch POSIX-only imports (e.g. fcntl)
            WINPY=$(ls -d /nix/store/*-python3-x86_64-w64-mingw32-* 2>/dev/null | grep -v .drv | head -1 || true)
            [ -z "$WINPY" ] && WINPY=$(nix build --print-out-paths --no-link \
              --impure --expr '(import <nixpkgs> {}).pkgsCross.mingwW64.python311' 2>/dev/null | head -1 || true)
            if [ -n "$WINPY" ] && [ -x "$WINPY/bin/python3.exe" ]; then
              wine64 "$WINPY/bin/python3.exe" -c "import sys; sys.path.insert(0, r'result-win/lib/python3.12/site-packages'); import prjxray.util, prjxray.fasm_assembler, fasm; print('windows-python imports OK')"
            else
              echo "WARNING: mingw python not found; windows-python import check skipped"
            fi
          '

      - name: E2E — synth (yosys) -> nextpnr.exe -> fasm2frames -> xc7frames2bit.exe
        run: |
          nix shell nixpkgs#wine64 nixpkgs#yosys nixpkgs#python312 -c bash -euo pipefail -c '
            export WINEPREFIX="$PWD/.wine" WINEDEBUG=-all
            PKG=result-win
            DB=$PKG/share/nextpnr/external/prjxray-db/artix7
            mkdir -p run && cd run
            yosys -q -p "synth_xilinx -arch xc7 -top ledon; write_json ledon.json" ../example/ledon.v
            # report script exercising nextpnr's embedded python (apio passes this
            # via --post-route; proves apio report works on Windows).
            printf "%s\n" "import json, os" "from pathlib import Path" \
              "rep = {\"utilization\": {}}" \
              "for b in ctx.getBels():" \
              "    t = ctx.getBelType(b); rep[\"utilization\"][t] = rep[\"utilization\"].get(t, 0) + 1" \
              "Path(os.environ[\"ENV_BUILD_PATH\"], \"hardware.pnr\").write_text(json.dumps(rep))" \
              "print(\"POST_ROUTE_OK types=\", len(rep[\"utilization\"]))" > report.py
            export ENV_BUILD_PATH="$PWD"
            wine64 ../$PKG/bin/nextpnr-xilinx.exe --chipdb ../$PKG/chipdb/xc7a35tcpg236.bin \
              --xdc ../config/basys3.xdc --json ledon.json --fasm ledon.fasm \
              --post-route report.py --router router2
            test -f hardware.pnr \
              && echo "✅ parity: embedded python ran --post-route -> apio report works"
            # fasm2frames exactly like apio on real Windows: the WINDOWS
            # python + a shell redirect (catches POSIX-isms like /dev/stdout)
            WINPY=$(ls -d /nix/store/*-python3-x86_64-w64-mingw32-* 2>/dev/null | grep -v .drv | head -1 || true)
            if [ -n "$WINPY" ] && [ -x "$WINPY/bin/python3.exe" ]; then
              PYTHONPATH=../$PKG/lib/python3.12/site-packages \
                wine64 "$WINPY/bin/python3.exe" ../$PKG/libexec/fasm2frames \
                --part xc7a35tcpg236-1 --db-root ../$DB ledon.fasm > ledon.frames
              echo "fasm2frames ran under the WINDOWS python"
            else
              PYTHONPATH=../$PKG/lib/python3.12/site-packages \
                python3 ../$PKG/libexec/fasm2frames --part xc7a35tcpg236-1 --db-root ../$DB \
                ledon.fasm > ledon.frames
              echo "WARNING: mingw python not found; used host python for fasm2frames"
            fi
            test -s ledon.frames
            wine64 ../$PKG/bin/xc7frames2bit.exe \
              --part_file ../$DB/xc7a35tcpg236-1/part.yaml --part_name xc7a35tcpg236-1 \
              --frm_file ledon.frames --output_file ledon.bit
            ls -la ledon.bit && echo "✅ E2E: bitstream generated by the Windows toolchain"
            # nextpnr nix-patch parity ON THE EXE (the 20260716 exe shipped
            # without the patch list): a virtual clock in the XDC must warn,
            # not crash, and the per-clock fmax getter must be exposed to the
            # embedded python. Std handles must be pipes/dev-null under wine.
            printf "%s\n" "module blinky(input wire clk, output wire led);" \
              "reg [23:0] c; always @(posedge clk) c <= c + 1;" \
              "assign led = c[23]; endmodule" > blinky.v
            yosys -q -p "synth_xilinx -arch xc7 -top blinky; write_json blinky.json" blinky.v
            printf "%s\n" \
              "set_property -dict { PACKAGE_PIN W5 IOSTANDARD LVCMOS33 } [get_ports {clk}]" \
              "set_property -dict { PACKAGE_PIN U16 IOSTANDARD LVCMOS33 } [get_ports {led}]" \
              "create_clock -period 35.000 -name VIRTUAL_c1 -waveform {0.000 17.500}" > vclk.xdc
            printf "%s\n" "print(\"FMAX_JSON:\", ctx.reportClockFmaxJson())" > fmax.py
            wine64 ../$PKG/bin/nextpnr-xilinx.exe --chipdb ../$PKG/chipdb/xc7a35tcpg236.bin \
              --xdc vclk.xdc --json blinky.json --fasm blinky.fasm --router router2 \
              --post-route fmax.py --freq 50 </dev/null 2>&1 | tee vclk.log
            grep -q "ignoring virtual clock" vclk.log \
              && echo "✅ exe parity: virtual clock warned (no crash)"
            grep -q "FMAX_JSON: {\"" vclk.log \
              && echo "✅ exe parity: per-clock fmax getter exposed"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: apio-openxc7-windows-amd64
          path: ${{ steps.tar.outputs.name }}
          if-no-files-found: error
