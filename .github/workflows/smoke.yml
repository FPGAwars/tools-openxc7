# F6 / GATE C — end-to-end smoke test on macOS (Apple Silicon).
# Builds the darwin-arm64 openXC7 package, installs it AND the upstream
# oss-cad-suite darwin tarball exactly as a user would, then runs the LED
# example (yosys synth -> nextpnr-xilinx -> fasm2frames -> xc7frames2bit) and
# checks a real bitstream is produced. This proves the relocated Mach-O
# toolchain runs outside /nix/store end to end.
#
# Complementary to the L1 gate (scripts/validate-package.sh, run by
# darwin-package.yml): this one is the cheap PR guard for the "installs and
# runs like a user does" property, so it keeps a single LED example instead
# of the full multi-part E2E. It never GENERATES the chipdb — this runner
# has 7 GB of RAM and cannot build the big parts; it seeds from the shared
# pin-keyed cache that linux-package.yml populates.
name: smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'openxc7-pack.py'
      - 'pack/**'
      - 'macpack.py'
      - 'flake.nix'
      - 'nix/**'
      - 'example/**'
      - 'config/**'
      - 'lib/**'
      - 'install*.sh'
      - 'start'

jobs:
  macos-e2e:
    name: macOS LED example end-to-end
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false          # no branded gantt/Discord footer
          diagnostic-endpoint: ""   # no telemetry

      # KEEP THE FILE LIST IN SYNC with linux-package.yml / darwin-package.yml
      - name: Seed the chipdb from the shared cache
        uses: actions/cache/restore@v6
        with:
          path: chipdb-cache
          key: chipdb-v1-${{ hashFiles('nix/nextpnr-xilinx.nix', 'nix/prjxray.nix', 'nix/nextpnr-xilinx-chipdb.nix', 'chipdb-parts.json') }}

      - name: Build the darwin-arm64 package
        env:
          OPENXC7_CHIPDB_SEED: ${{ github.workspace }}/chipdb-cache
        run: |
          n=$(ls chipdb-cache/*.bin 2>/dev/null | wc -l | tr -d ' ')
          if [ "$n" = "0" ]; then
            echo "::error::No chipdb seed for these pins. This runner cannot regenerate the big parts (7 GB RAM). Run linux-package (or release) on this branch first to populate the shared cache."
            exit 1
          fi
          echo "chipdb seed: $n bins"
          rm -rf dist   # stale-dist guard: the seed must win
          # .#pack: the packaging shell, without the fpga-assembler getFlake
          nix develop .#pack --command bash -c 'python3.12 openxc7-pack.py'

      - name: Install openxc7 (as a user would)
        run: |
          mkdir -p "$HOME/.local/openxc7"
          tar xzf apio-openxc7-darwin-arm64-*.tgz -C "$HOME/.local/openxc7"
          xattr -dr com.apple.quarantine "$HOME/.local/openxc7" 2>/dev/null || true

      - name: Install oss-cad-suite (darwin tarball)
        run: bash ./install-oss-cad-suite.sh

      - name: Build the LED example (synth -> pnr -> fasm -> bit)
        run: |
          source ./start
          cd example
          make
          test -f ledon.bit && echo "✅ bitstream produced: $(ls -l ledon.bit)"
