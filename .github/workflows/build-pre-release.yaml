# Release pipeline v2 — thin orchestrator.
#
# Every platform is built and validated by its OWN reusable workflow, on its
# own native runner (windows is cross-built from linux; nixpkgs cannot cross
# Linux<->macOS, and Nix does not run on Windows):
#
#   linux-package.yml    ubuntu-latest   native   (also owns the chipdb)
#   darwin-package.yml   macos-14        native   (seeded from linux)
#   windows-package.yml  ubuntu-latest   cross    (validated under wine)
#
# Each carries its own gate, so the exact same build+validation runs whether
# you dispatch it standalone or through a release. This workflow only picks
# the date, wires the chipdb seed, and — if EVERYTHING is green — publishes.
#
# The release is created at the END, as a dated PRERELEASE (never latest),
# following the FPGAwars ecosystem convention (fpgawars/apio-workflows):
# daily cron, the tag resolved at the very beginning, an existing same-tag
# pre-release is replaced, a same-tag STABLE release fails the run, and only
# the newest N pre-releases are kept. Any red aborts with no release; the
# build artifacts stay downloadable for debugging. Promotion to a real
# (latest) release is a manual, human step (see the release note).
name: build-pre-release

on:
  schedule:
    - cron: "0 0 * * *"      # daily, like the other FPGAwars libraries
  workflow_dispatch:
    inputs:
      date:
        description: "Release date YYYY-MM-DD (default: today, UTC)"
        required: false
  push:
    tags:
      - '20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]'   # dated tags, e.g. 2026-06-20

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The date is resolved ONCE here and passed down: apio derives the asset
  # date from the release TAG, so tag and every asset name must match.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.d.outputs.date }}
      skip: ${{ steps.nc.outputs.skip }}
    steps:
      - name: Get release and package tags (ecosystem convention)
        uses: fpgawars/apio-workflows/.github/actions/get-release-and-package-tags@main
        with:
          release-tag-var: RELEASE_TAG
          package-tag-var: PACKAGE_TAG
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            DATE="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE="$RELEASE_TAG"
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Release date: $DATE"
      # Scheduled runs only build when there is something new: if the last
      # published release was built from this same commit, stop here (three
      # platform builds and a release that would be byte-identical noise).
      # Dispatch and tag-push runs always build (explicit intent).
      - name: No-change guard (schedule only)
        id: nc
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1             --json tagName -q '.[0].tagName' 2>/dev/null || true)
          LAST_SHA=""
          [ -n "$LAST_TAG" ] && LAST_SHA=$(gh release view "$LAST_TAG"             --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish || true)
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$GITHUB_SHA" ]; then
            echo "no changes since release $LAST_TAG ($LAST_SHA) — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Fail FAST if today's tag already exists as a stable release — before
      # spending 3 platform builds on a run that must not publish.
      - name: Ensure no conflicting release (early, just-check)
        uses: fpgawars/apio-workflows/.github/actions/ensure-no-conflicting-release@main
        env:
          GH_TOKEN: ${{ github.token }}   # the action drives `gh`, which requires it in Actions
          # prepare has NO checkout (it is deliberately light), and gh needs
          # a repo context: without a git dir it dies on its first command.
          # The ecosystem repos run this action after checkout; GH_REPO is
          # the checkout-free way to give gh its target.
          GH_REPO: ${{ github.repository }}
        with:
          release-tag: ${{ steps.d.outputs.date }}
          just-check: "true"

  linux:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/linux-package.yml
    with:
      date: ${{ needs.prepare.outputs.date }}

  # After linux: it publishes the chipdb-bins artifact this job seeds from.
  darwin:
    needs: [prepare, linux]
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/darwin-package.yml
    with:
      date: ${{ needs.prepare.outputs.date }}
      seed_from_artifact: true

  windows:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/windows-package.yml
    with:
      date: ${{ needs.prepare.outputs.date }}

  publish:
    needs: [prepare, linux, darwin, windows]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7    # scripts/ for chipdb-assets + asset-check

      - uses: actions/download-artifact@v8
        with:
          pattern: apio-openxc7-*     # the 3 package artifacts (not chipdb-bins)
          merge-multiple: true

      # The platform-independent per-FPGA assets (apio's upcoming on-demand
      # loader): one gzipped bin per manifest part + an index with both
      # hashes and the chipdb identity stamp. Same bins the packages carry.
      - uses: actions/download-artifact@v8
        with:
          name: chipdb-bins
          path: chipdb-bins

      - name: Build the per-FPGA chipdb assets
        run: |
          D="${{ needs.prepare.outputs.date }}"
          bash scripts/chipdb-assets.sh chipdb-bins chipdb-assets "${D//-/}" && ls -la chipdb-assets | head -5

      - name: Assert the chipdb is byte-identical linux<->windows
        run: |
          mkdir lin win
          tar xzf apio-openxc7-linux-x86-64-*.tgz -C lin
          tar xzf apio-openxc7-windows-amd64-*.tgz -C win
          n=0
          for f in lin/chipdb/*.bin; do
            b=$(basename "$f")
            cmp "$f" "win/chipdb/$b" || { echo "chipdb differs: $b"; exit 1; }
            n=$((n + 1))
          done
          echo "chipdb parity OK ($n bins byte-identical)"
          rm -rf lin win

      # Ecosystem convention (fpgawars/apio-workflows): keep only the newest
      # pre-releases, then replace today's pre-release if it exists — and FAIL
      # if the tag was already promoted to a stable release (never clobber it).
      - name: Cleanup old pre-releases (keep the newest 5)
        uses: fpgawars/apio-workflows/.github/actions/cleanup-old-prereleases@main
        with:
          pre-release-keep-count: "5"

      - name: Ensure no conflicting release (delete same-tag pre-release, fail on stable)
        uses: fpgawars/apio-workflows/.github/actions/ensure-no-conflicting-release@main
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release-tag: ${{ needs.prepare.outputs.date }}

      - name: Create the dated prerelease (never latest) and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ needs.prepare.outputs.date }}
        run: |
          ls -la apio-openxc7-*.tgz
          # every asset must carry the tag's date, or apio 404s at install
          for f in apio-openxc7-*.tgz; do
            case "$f" in
              *"-${DATE//-/}.tgz") ;;
              *) echo "::error::asset $f is not dated ${DATE//-/}"; exit 1 ;;
            esac
          done
          sha256sum apio-openxc7-*.tgz > SHA256SUMS
          cat SHA256SUMS
          cat > RELEASE-BODY.md <<EOFBODY
          openXC7 toolchain — $DATE. Validated by CI (package gate, regression
          suite on the three platforms, linux/windows chipdb parity).

          ### Pre-release note
          This daily release was created as a pre-release and will be deleted
          after a few days unless it is marked as a stable release. To make it
          stable:
          * Open the release for editing.
          * Turn off the \\`Set as a pre-release\\` checkbox.
          * (optional) Turn on the \\`Set as the latest release\\` checkbox.
          * Remove this pre-release note; then Update Release.
          * Then bump \\`OPENXC7_DATE\\` in lib/common.sh and the openxc7 tag in
            apio's remote-config, and run scripts/check-pins.sh (see the job
            summary checklist).
          EOFBODY
          gh release create "$DATE" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$DATE" --prerelease --latest=false \
            --notes-file RELEASE-BODY.md
          gh release upload "$DATE" apio-openxc7-*.tgz SHA256SUMS \
            chipdb-assets/* --repo "$GITHUB_REPOSITORY"

      # Close the loop: re-resolve every asset by apio's tag->date->name rule
      # against what GitHub actually serves, and require the published
      # SHA256SUMS to match the tarballs validated above (the 2026-07-24
      # class of failure -- a tag apio resolves to nothing -- dies here).
      - name: Verify the published assets the way apio will fetch them
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_CHECK_REPO: ${{ github.repository }}
          DATE: ${{ needs.prepare.outputs.date }}
        run: |
          bash scripts/asset-check.sh "$DATE" --expect-dir .

      # Promotion stays a human decision; these are the steps it involves,
      # including the pin bumps that keep installers and apio aligned with
      # what is actually published (scripts/check-pins.sh asserts it).
      - name: Promotion checklist
        env:
          DATE: ${{ needs.prepare.outputs.date }}
        run: |
          {
            echo "## Release candidate \`$DATE\` published (prerelease, not latest)"
            echo
            echo "To promote it:"
            echo
            echo "1. Try it for real (\`apio\` install from the tag, board test if it applies)."
            echo "2. \`gh release edit $DATE --prerelease=false --latest\`"
            echo "3. Bump \`OPENXC7_DATE\` in \`lib/common.sh\` to \`$DATE\`."
            echo "4. Bump the \`openxc7\` tag in apio's \`remote-config/apio-1.5.x.jsonc\`."
            echo "5. \`scripts/check-pins.sh\` must come back green."
          } >> "$GITHUB_STEP_SUMMARY"
