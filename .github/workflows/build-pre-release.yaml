# Daily build and release workflow.
#
# The apio openxc7 package is the openXC7 toolchain as released by
# OPENXC7_REPO, repackaged for apio, the way tools-oss-cad-suite repackages
# the YosysHQ oss-cad-suite. To bump it, set OPENXC7_RELEASE_TAG to a newer
# release of that repo. The yosys it was validated with comes with
# it (yosys-release-tag in its BUILD-INFO.json).

name: build-pre-release

on:
  # Runs daily at UTC midnight to minimize risk of overstepping
  # manual builds of same date.
  schedule:
    - cron: "0 0 * * *"

  # Allow manual activations.
  workflow_dispatch:

permissions:
  # Allow release creation
  contents: write

env:
  # The openXC7 toolchain release to repackage. yyyy-mm-dd.
  # See https://github.com/cavearr/toolchain-openxc7-releases/releases
  #
  OPENXC7_RELEASE_TAG: "2026-10-03"
  OPENXC7_REPO: "cavearr/toolchain-openxc7-releases"

  # These are set later
  RELEASE_TAG: ""
  PACKAGE_TAG: ""
  YOSYS_RELEASE_TAG: ""

jobs:
  # -- Build packages for all supported architectures and
  # -- export them in a release.
  build-pre-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Get release and package tags
        uses: fpgawars/apio-workflows/.github/actions/get-release-and-package-tags@main
        with:
          release-tag-var: RELEASE_TAG
          package-tag-var: PACKAGE_TAG

      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Get repository commit
        uses: fpgawars/apio-workflows/.github/actions/get-repo-info@main
        with:
          repo-dir: .
          repo-var: REPO
          commit-var: RELEASE_COMMIT

      # SHA256SUMS lets build.py check each tarball it downloads. The parts
      # index is published as is, and the toolchain's BUILD-INFO.json says
      # which yosys it was validated with.
      - name: Download the toolchain release info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _upstream
          gh release download "$OPENXC7_RELEASE_TAG" --repo "$OPENXC7_REPO" \
              --dir _upstream \
              --pattern SHA256SUMS \
              --pattern BUILD-INFO.json \
              --pattern XILINX-PARTS-INDEX.json
          cd _upstream
          sha256sum --check --ignore-missing SHA256SUMS
          cat -n BUILD-INFO.json
          echo "YOSYS_RELEASE_TAG=$(jq -er '."yosys-release-tag"' BUILD-INFO.json)" >> $GITHUB_ENV

      - name: Create the build-info.json file
        run: |
          cat > build-info.json <<EOF
          {
            "package-name":  "openxc7",
            "description" : "openXC7 tools for Apio (Xilinx 7-series)",
            "release-tag":  "$RELEASE_TAG",
            "yosys-release-tag": "$YOSYS_RELEASE_TAG",
            "openxc7-toolchain-release-tag": "$OPENXC7_RELEASE_TAG",
            "openxc7-toolchain-repo": "$OPENXC7_REPO",
            "build-repo":  "$REPO",
            "build-workflow":  "${{ github.workflow }}",
            "workflow-run-id":  "${{github.run_id}}",
            "workflow-run-number": "${{github.run_number}}",
            "build-time":  "$(date +'%Y-%m-%d %H:%M:%S %Z')",
            "commit":  "$RELEASE_COMMIT"
          }
          EOF

          cat -n build-info.json

      - name: Format build info json file in-place
        uses: fpgawars/apio-workflows/.github/actions/format-json-file@main
        with:
          json-file: build-info.json

      - name: Make the build info file read only
        run: |
          chmod 444 build-info.json

      - name: Build package [darwin-arm64]
        run: |
          python .github/workflows/build.py \
              --platform_id darwin-arm64 \
              --build-info-json build-info.json

      - name: Build package [linux-x86-64]
        run: |
          python .github/workflows/build.py \
              --platform_id linux-x86-64 \
              --build-info-json build-info.json

      - name: Build package [windows-amd64]
        run: |
          python .github/workflows/build.py \
              --platform_id windows-amd64 \
              --build-info-json build-info.json

      # The release carries six assets, as apio expects: the three packages,
      # the parts index, the build info and SHA256SUMS of the other five.
      - name: Add the release-level files
        run: |
          cp _upstream/XILINX-PARTS-INDEX.json _packages/
          cp build-info.json _packages/BUILD-INFO.json
          cd _packages
          sha256sum apio-openxc7-*.tgz XILINX-PARTS-INDEX.json BUILD-INFO.json > SHA256SUMS
          cat SHA256SUMS

      - name: List packages
        run: |
          ls -al _packages/*

      - name: Scan the package for viruses
        uses: fpgawars/apio-workflows/.github/actions/scan-files-for-viruses@main
        with:
          file-patterns: |
            _packages/apio-openxc7-*.tgz

      - name: Convert json build info to text
        uses: fpgawars/apio-workflows/.github/actions/json-to-text@main
        with:
          input-json: build-info.json
          output-text: build-info.txt

      # Summary for the workflow run page.
      - name: Prepare workflow run summary
        run: |
          cat  > RUN-SUMMARY.txt <<EOF

          Build info:
          \`\`\`
          $(cat build-info.txt)
          \`\`\`

          - [Cutoff commit](https://github.com/${REPO}/commit/${RELEASE_COMMIT})

          - [Underlying openXC7 toolchain release](https://github.com/${OPENXC7_REPO}/releases/tag/${OPENXC7_RELEASE_TAG})

          - [Generated pre-release](https://github.com/${REPO}/releases/tag/${RELEASE_TAG})

          EOF

          ls -al
          cat -n RUN-SUMMARY.txt

      - name: Post workflow run summary
        run: |
          cat RUN-SUMMARY.txt >> $GITHUB_STEP_SUMMARY

      - name: Prepare release text
        run: |
          cat  > RELEASE-BODY.txt <<EOF
          The openXC7 toolchain release [\`${OPENXC7_RELEASE_TAG}\`](https://github.com/${OPENXC7_REPO}/releases/tag/${OPENXC7_RELEASE_TAG})
          of [${OPENXC7_REPO}](https://github.com/${OPENXC7_REPO}), repackaged as the apio
          \`openxc7\` package.

          **Requires yosys from YosysHQ oss-cad-suite [\`${YOSYS_RELEASE_TAG}\`](https://github.com/YosysHQ/oss-cad-suite-build/releases/tag/${YOSYS_RELEASE_TAG})**
          (\`yosys-release-tag\` in \`BUILD-INFO.json\`; apio checks it).

          Assets: the three platform packages, \`XILINX-PARTS-INDEX.json\` (the
          parts index, also at the root of each package), \`BUILD-INFO.json\` and
          \`SHA256SUMS\`.

          ### Build info

          \`\`\`
          $(cat build-info.txt)
          \`\`\`

          ### Pre-release note

          This daily release was created as a pre-release and will be deleted
          after 5 days unless it's marked as a stable release. To make it a
          stable release, run the \`make-pre-release-stable\` workflow with this
          tag (it also removes this note).
          EOF

          cat -n RELEASE-BODY.txt

      - name: Cleanup old pre-releases
        uses: fpgawars/apio-workflows/.github/actions/cleanup-old-prereleases@main

      - name: Ensure no conflicting release
        uses: fpgawars/apio-workflows/.github/actions/ensure-no-conflicting-release@main
        with:
          release-tag: ${{ env.RELEASE_TAG }}

      - name: Create GitHub pre-release
        uses: fpgawars/apio-workflows/.github/actions/create-pre-release@main
        with:
          release_tag: ${{ env.RELEASE_TAG }}
          body_path: RELEASE-BODY.txt
          # We intensionally list explicitly all the expected files.
          files: |
            _packages/apio-openxc7-darwin-arm64-${{env.PACKAGE_TAG}}.tgz
            _packages/apio-openxc7-linux-x86-64-${{env.PACKAGE_TAG}}.tgz
            _packages/apio-openxc7-windows-amd64-${{env.PACKAGE_TAG}}.tgz
            _packages/XILINX-PARTS-INDEX.json
            _packages/BUILD-INFO.json
            _packages/SHA256SUMS
