# Daily build and release workflow.

name: build-pre-release

on:
  # Runs daily at UTC midnight to minimize risk of overstepping
  # manual builds of same date.
  schedule:
    - cron: "0 0 * * *"

  # Allow manual activations.
  workflow_dispatch:

permissions:
  # Allow release creation
  contents: write

env:
  # The openXC7 toolchain release to repackage. yyyy-mm-dd.
  # See https://github.com/cavearr/toolchain-openxc7-releases/releases
  #
  UPSTREAM_REPO: "cavearr/toolchain-openxc7-releases"
  UPSTREAM_RELEASE_TAG: "2026-10-03"

  # These are set later
  UPSTREAM_PACKAGE_TAG: ""
  RELEASE_TAG: ""
  PACKAGE_TAG: ""
  YOSYS_RELEASE_TAG: ""

jobs:
  # -- Build packages for all supported architectures and
  # -- export them in a release.
  build-pre-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Get release and package tags
        uses: fpgawars/apio-workflows/.github/actions/get-release-and-package-tags@main
        with:
          release-tag-var: RELEASE_TAG
          package-tag-var: PACKAGE_TAG

      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Get repository commit
        uses: fpgawars/apio-workflows/.github/actions/get-repo-info@main
        with:
          repo-dir: .
          repo-var: REPO
          commit-var: RELEASE_COMMIT

      - name: Compute env var UPSTREAM_PACKAGE_TAG
        run: |
          upstream_package_tag="${UPSTREAM_RELEASE_TAG//-/}"
          echo "UPSTREAM_PACKAGE_TAG=$upstream_package_tag"
          echo "UPSTREAM_PACKAGE_TAG=$upstream_package_tag" >> "$GITHUB_ENV"

      - name: Download upstream packages to _packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          mkdir _packages
          gh release download "$UPSTREAM_RELEASE_TAG" \
              --repo "$UPSTREAM_REPO" \
              --dir _packages \
              --pattern openxc7-toolchain-darwin-arm64-${UPSTREAM_PACKAGE_TAG}.tgz \
              --pattern openxc7-toolchain-linux-x86-64-${UPSTREAM_PACKAGE_TAG}.tgz \
              --pattern openxc7-toolchain-windows-amd64-${UPSTREAM_PACKAGE_TAG}.tgz
          ls -al _packages

      - name: List _packages
        run: |
          set -x
          ls -al _packages

      - name: Uncompress upstream package darwin-arm64
        run: |
          set -x
          mkdir -p _packages/darwin-arm64
          tar \
            -xzf \
            _packages/openxc7-toolchain-darwin-arm64-${UPSTREAM_PACKAGE_TAG}.tgz \
            -C _packages/darwin-arm64
          ls -al _packages/darwin-arm64

      - name: Uncompress upstream package linux-x86-64
        run: |
          set -x
          mkdir -p _packages/linux-x86-64
          tar \
            -xzf \
            _packages/openxc7-toolchain-linux-x86-64-${UPSTREAM_PACKAGE_TAG}.tgz \
            -C _packages/linux-x86-64
          ls -al _packages/linux-x86-64

      - name: Uncompress upstream package windows-amd64
        run: |
          set -x
          mkdir -p _packages/windows-amd64
          tar \
            -xzf \
            _packages/openxc7-toolchain-windows-amd64-${UPSTREAM_PACKAGE_TAG}.tgz \
            -C _packages/windows-amd64
          ls -al _packages/windows-amd64

      - name: Rename upstreams to XILINX-PARTS-INVENTORY.json
        run: |
          set -x

          mv _packages/darwin-arm64/XILINX-PARTS-INDEX.json \
             _packages/darwin-arm64/XILINX-PARTS-INVENTORY.json

          mv _packages/linux-x86-64/XILINX-PARTS-INDEX.json \
             _packages/linux-x86-64/XILINX-PARTS-INVENTORY.json

          mv _packages/windows-amd64/XILINX-PARTS-INDEX.json  \
             _packages/windows-amd64/XILINX-PARTS-INVENTORY.json

          ls -al _packages/darwin-arm64
          ls -al _packages/linux-x86-64
          ls -al _packages/windows-amd64

      - name: Verify that upstream XILINX-PARTS-INVENTORY.json match
        run: |
          set -x
          diff _packages/darwin-arm64/XILINX-PARTS-INVENTORY.json \
               _packages/linux-x86-64/XILINX-PARTS-INVENTORY.json

          diff _packages/darwin-arm64/XILINX-PARTS-INVENTORY.json \
               _packages/windows-amd64/XILINX-PARTS-INVENTORY.json

      - name: Verify upstream BUILD-INFO.json match
        run: |
          set -x
          cat -n _packages/darwin-arm64/BUILD-INFO.json
          cat -n _packages/linux-x86-64/BUILD-INFO.json
          cat -n _packages/windows-amd64/BUILD-INFO.json

          # We ignore the fields target-platform and file-name.
          diff -u \
            <(jq -S 'del(.target-platform, .file-name)' _packages/darwin-arm64/BUILD-INFO.json) \
            <(jq -S 'del(.target-platform, .file-name)' _packages/linux-x86-64/BUILD-INFO.json)

          diff -u \
            <(jq -S 'del(.target-platform, .file-name)' _packages/darwin-arm64/BUILD-INFO.json) \
            <(jq -S 'del(.target-platform, .file-name)' _packages/windows-amd64/BUILD-INFO.json)

      - name: Extract YOSYS_RELEASE_TAG from upstream package
        run: |
          yosys_release_tag=$(jq -r '.["yosys-release-tag"]' _packages/darwin-arm64/BUILD-INFO.json)
          echo "YOSYS_RELEASE_TAG=$yosys_release_tag"
          echo "YOSYS_RELEASE_TAG=$yosys_release_tag" >> "$GITHUB_ENV"

      - name: Create the base BUILD-INFO.json file
        run: |
          cat > BUILD-INFO.json <<EOF
          {
            "package-name":  "openxc7",
            "description" : "openXC7 tools for Apio (Xilinx 7-series)",
            "release-tag":  "$RELEASE_TAG",
            "yosys-release-tag": "$YOSYS_RELEASE_TAG",
            "upstream-repo": "$UPSTREAM_REPO",
            "upstream-release-tag": "$UPSTREAM_RELEASE_TAG",
            "build-repo":  "$REPO",
            "build-workflow":  "${{ github.workflow }}",
            "workflow-run-id":  "${{github.run_id}}",
            "workflow-run-number": "${{github.run_number}}",
            "build-time":  "$(date +'%Y-%m-%d %H:%M:%S %Z')",
            "commit":  "$RELEASE_COMMIT"
          }
          EOF

          cat -n BUILD-INFO.json

      - name: Format the base build info json file in-place
        uses: fpgawars/apio-workflows/.github/actions/format-json-file@main
        with:
          json-file: BUILD-INFO.json

      - name: Make the base build info file read only
        run: |
          chmod 444 BUILD-INFO.json

      - name: Update package darwin-arm64 in-place
        run: |
          set -x
          python .github/workflows/build.py \
              --platform-id darwin-arm64 \
              --build-info-json BUILD-INFO.json \
              --package-dir _packages/darwin-arm64

      - name: Archive the darwin-arm64 package dir
        run: |
          set -x
          tar czf  _packages/apio-openxc7-darwin-arm64-${PACKAGE_TAG}.tgz -C _packages/darwin-arm64 .
          ls -al _packages

      - name: Update package linux-x86-64 in-place
        run: |
          python .github/workflows/build.py \
              --platform-id linux-x86-64 \
              --build-info-json BUILD-INFO.json \
              --package-dir _packages/linux-x86-64

      - name: Archive the linux-x86-64 package dir
        run: |
          set -x
          tar czf  _packages/apio-openxc7-linux-x86-64-${PACKAGE_TAG}.tgz -C _packages/linux-x86-64 .
          ls -al _packages

      - name: Update package windows-amd64 in-place
        run: |
          python .github/workflows/build.py \
              --platform-id windows-amd64 \
              --build-info-json BUILD-INFO.json \
              --package-dir _packages/windows-amd64

      - name: Archive the windows-amd64 package dir
        run: |
          set -x
          tar czf  _packages/apio-openxc7-windows-amd64-${PACKAGE_TAG}.tgz -C _packages/windows-amd64 .
          ls -al _packages

      - name: Verify that the XILINX-PARTS-INDEX.json match
        run: |
          set -x
          diff _packages/darwin-arm64/XILINX-PARTS-INDEX.json \
               _packages/linux-x86-64/XILINX-PARTS-INDEX.json

          diff _packages/darwin-arm64/XILINX-PARTS-INDEX.json \
               _packages/windows-amd64/XILINX-PARTS-INDEX.json

      - name: List packages
        run: |
          ls -al _packages/*


      # We scan both the pre and post archive packages.
      - name: Scan the package for viruses
        uses: fpgawars/apio-workflows/.github/actions/scan-files-for-viruses@main
        with:
          file-patterns: _packages

      - name: Convert base json build info to text
        uses: fpgawars/apio-workflows/.github/actions/json-to-text@main
        with:
          input-json: BUILD-INFO.json
          output-text: build-info.txt

      # Summary for the workflow run page.
      - name: Prepare workflow run summary
        run: |
          cat  > RUN-SUMMARY.txt <<EOF

          Build info:
          \`\`\`
          $(cat build-info.txt)
          \`\`\`

          - [Cutoff commit](https://github.com/${REPO}/commit/${RELEASE_COMMIT})

          - [Underlying openXC7 toolchain release](https://github.com/${UPSTREAM_REPO}/releases/tag/${UPSTREAM_RELEASE_TAG})

          - [Generated pre-release](https://github.com/${REPO}/releases/tag/${RELEASE_TAG})

          EOF

          ls -al
          cat -n RUN-SUMMARY.txt

      - name: Post workflow run summary
        run: |
          cat RUN-SUMMARY.txt >> $GITHUB_STEP_SUMMARY

      - name: Prepare release text
        run: |
          cat  > RELEASE-BODY.txt <<EOF
          The openXC7 toolchain release [\`${UPSTREAM_RELEASE_TAG}\`](https://github.com/${UPSTREAM_REPO}/releases/tag/${UPSTREAM_RELEASE_TAG})
          of [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}), repackaged as the apio
          \`openxc7\` package.

          **Requires yosys from YosysHQ oss-cad-suite [\`${YOSYS_RELEASE_TAG}\`](https://github.com/YosysHQ/oss-cad-suite-build/releases/tag/${YOSYS_RELEASE_TAG})**
          (\`yosys-release-tag\` in \`BUILD-INFO.json\`; apio checks it).

          Assets: the three platform packages, \`XILINX-PARTS-INDEX.json\` (the
          parts index, also at the root of each package), \`BUILD-INFO.json\` and
          \`SHA256SUMS\`.

          ### Build info

          \`\`\`
          $(cat build-info.txt)
          \`\`\`

          ### Pre-release note

          This daily release was created as a pre-release and will be deleted
          after 5 days unless it's marked as a stable release. To make it a
          stable release, run the \`make-pre-release-stable\` workflow with this
          tag (it also removes this note).
          EOF

          cat -n RELEASE-BODY.txt

      - name: Cleanup old pre-releases
        uses: fpgawars/apio-workflows/.github/actions/cleanup-old-prereleases@main

      - name: Ensure no conflicting release
        uses: fpgawars/apio-workflows/.github/actions/ensure-no-conflicting-release@main
        with:
          release-tag: ${{ env.RELEASE_TAG }}

      - name: Create GitHub pre-release
        uses: fpgawars/apio-workflows/.github/actions/create-pre-release@main
        with:
          release_tag: ${{ env.RELEASE_TAG }}
          body_path: RELEASE-BODY.txt
          # We intensionally list explicitly all the expected files.
          files: |
            _packages/apio-openxc7-darwin-arm64-${{env.PACKAGE_TAG}}.tgz
            _packages/apio-openxc7-linux-x86-64-${{env.PACKAGE_TAG}}.tgz
            _packages/apio-openxc7-windows-amd64-${{env.PACKAGE_TAG}}.tgz
            _packages/linux-x86-64/XILINX-PARTS-INDEX.json
            BUILD-INFO.json
