# Release pipeline v2 — thin orchestrator.
#
# The chipdb is generated ONCE (it is platform-independent), then every
# platform is built and validated by its OWN reusable workflow, in parallel,
# on its own native runner (windows is cross-built from linux; nixpkgs cannot
# cross Linux<->macOS, and Nix does not run on Windows):
#
#   chipdb.yml           ubuntu-22.04   bins + per-FPGA assets + CHIPDB-INFO
#   linux-package.yml    ubuntu-22.04   native   (consumes chipdb artifacts)
#   darwin-package.yml   macos-14        native   (consumes chipdb artifacts)
#   windows-package.yml  ubuntu-22.04   cross    (consumes chipdb artifacts; wine)
#
# There is ONE chipdb source: the per-FPGA assets published below, built by
# that single job. No package ships a chipdb any more (apio#947): each one
# embeds that job's CHIPDB-INFO.json and its L1/L2 gates validate it with
# the very bins the assets were made from, injected the way apio's loader
# does. Each platform carries its own gate, so the exact same
# build+validation runs whether you dispatch it standalone or through a
# release. This workflow only picks the date, wires the chipdb artifacts,
# and — if EVERYTHING is green — publishes.
#
# The release is created at the END, as a dated PRERELEASE (never latest),
# following the FPGAwars ecosystem convention (fpgawars/apio-workflows):
# daily cron, the tag resolved at the very beginning, an existing same-tag
# pre-release is replaced, a same-tag STABLE release fails the run, and only
# the newest N pre-releases are kept. Any red aborts with no release; the
# build artifacts stay downloadable for debugging. Promotion to a real
# (latest) release is a manual, human step (see the release note).
name: build-pre-release

on:
  schedule:
    - cron: "0 0 * * *"      # daily, like the other FPGAwars libraries
  workflow_dispatch:
    inputs:
      date:
        description: "Release date YYYY-MM-DD (default: today, UTC)"
        required: false
      regenerate_chipdb:
        description: "Ignore the chipdb cache and generate every part from scratch (tests the generation path)"
        required: false
        default: false
        type: boolean
  # NOTE: no push-tags trigger. It was redundant with dispatch, and the
  # release step now creates the tag with a PAT (see below) — a PAT-created
  # tag WOULD fire a tags trigger, recursing into this very workflow.

# The upstream YosysHQ oss-cad-suite release this package expects at
# runtime (the cross-package matching key apio checks, apio#927). Declared
# here, at the top, following the ecosystem convention
# (tools-oss-cad-suite build-pre-release.yaml); propagated to the platform
# workflows, asserted against the validation environment they install, and
# exported into every package's BUILD-INFO.json as "yosys-release-tag".
env:
  YOSYS_RELEASE_TAG: "2026-03-24"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The date is resolved ONCE here and passed down: apio derives the asset
  # date from the release TAG, so tag and every asset name must match.
  prepare:
    runs-on: ubuntu-22.04            # ecosystem runner version (apio hit issues on 24.04; see apio build-linux-x86-64.yaml)
    outputs:
      date: ${{ steps.d.outputs.date }}
    steps:
      - name: Get release and package tags (ecosystem convention)
        uses: fpgawars/apio-workflows/.github/actions/get-release-and-package-tags@main
        with:
          release-tag-var: RELEASE_TAG
          package-tag-var: PACKAGE_TAG
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE="$RELEASE_TAG"
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Release date: $DATE"
      # NOTE: scheduled runs build UNCONDITIONALLY, even with no new commits
      # (ecosystem convention, zapta 2026-08-09: a daily build also catches
      # breakage coming from the github action tools themselves; it is what
      # every other apio package does).  The former no-change guard lived
      # here; cleanup-old-prereleases (keep-5) absorbs the extra releases.

      # Fail FAST if today's tag already exists as a stable release — before
      # spending 3 platform builds on a run that must not publish.
      - name: Ensure no conflicting release (early, just-check)
        uses: fpgawars/apio-workflows/.github/actions/ensure-no-conflicting-release@main
        env:
          GH_TOKEN: ${{ github.token }}   # the action drives `gh`, which requires it in Actions
          # prepare has NO checkout (it is deliberately light), and gh needs
          # a repo context: without a git dir it dies on its first command.
          # The ecosystem repos run this action after checkout; GH_REPO is
          # the checkout-free way to give gh its target.
          GH_REPO: ${{ github.repository }}
        with:
          release-tag: ${{ steps.d.outputs.date }}
          just-check: "true"

  # The chipdb is generated ONCE (platform-independent bins, revision-keyed
  # cache). The same job also builds the public per-FPGA assets and the
  # CHIPDB-INFO document before any platform starts.
  chipdb:
    needs: prepare
    uses: ./.github/workflows/chipdb.yml
    with:
      date: ${{ needs.prepare.outputs.date }}
      regenerate: ${{ github.event.inputs.regenerate_chipdb == 'true' }}

  linux:
    needs: [prepare, chipdb]
    uses: ./.github/workflows/linux-package.yml
    with:
      date: ${{ needs.prepare.outputs.date }}
      yosys_release_tag: "2026-03-24"   # keep in sync with env.YOSYS_RELEASE_TAG (env is not visible to reusable-workflow inputs)
      chipdb_source: ${{ needs.chipdb.outputs.mode }}
      chipdb_id: ${{ needs.chipdb.outputs.identity }}
      chipdb_info: ${{ needs.chipdb.outputs.info }}

  darwin:
    needs: [prepare, chipdb]
    uses: ./.github/workflows/darwin-package.yml
    with:
      date: ${{ needs.prepare.outputs.date }}
      yosys_release_tag: "2026-03-24"   # keep in sync with env.YOSYS_RELEASE_TAG (env is not visible to reusable-workflow inputs)
      chipdb_source: ${{ needs.chipdb.outputs.mode }}
      chipdb_id: ${{ needs.chipdb.outputs.identity }}
      chipdb_info: ${{ needs.chipdb.outputs.info }}

  windows:
    needs: [prepare, chipdb]
    uses: ./.github/workflows/windows-package.yml
    with:
      date: ${{ needs.prepare.outputs.date }}
      yosys_release_tag: "2026-03-24"   # keep in sync with env.YOSYS_RELEASE_TAG (env is not visible to reusable-workflow inputs)
      chipdb_source: ${{ needs.chipdb.outputs.mode }}
      chipdb_id: ${{ needs.chipdb.outputs.identity }}
      chipdb_info: ${{ needs.chipdb.outputs.info }}

  pre-release:
    needs: [prepare, chipdb, linux, darwin, windows]
    runs-on: ubuntu-22.04            # ecosystem runner version (apio hit issues on 24.04; see apio build-linux-x86-64.yaml)
    steps:
      - uses: actions/checkout@v7    # scripts/asset-check.sh

      - uses: actions/download-artifact@v8
        with:
          pattern: apio-openxc7-*     # the 3 package artifacts (not chipdb-bins)
          merge-multiple: true

      # Built by chipdb.yml from the same verified bins and packaged database.
      # They are release inputs now, not derived again by the publisher —
      # and, since no package ships a chipdb, they are how users get one.
      #
      # There is no three-way parity check any more: nothing to compare, the
      # three packages carry no bins. What every user will end up with is
      # proved where each package is assembled — its L1 gate injects THESE
      # bins into the extracted tarball and checks them against the size and
      # sha256 the chipdb job recorded in CHIPDB-INFO.json. The per-part
      # `bytes | sha256` table lives in that job's summary.
      - uses: actions/download-artifact@v8
        with:
          name: chipdb-assets
          path: chipdb-assets

      # Ecosystem convention (fpgawars/apio-workflows): keep only the newest
      # pre-releases, then replace today's pre-release if it exists — and FAIL
      # if the tag was already promoted to a stable release (never clobber it).
      - name: Cleanup old pre-releases (keep the newest 5)
        uses: fpgawars/apio-workflows/.github/actions/cleanup-old-prereleases@main
        with:
          pre-release-keep-count: "5"

      - name: Ensure no conflicting release (delete same-tag pre-release, fail on stable)
        uses: fpgawars/apio-workflows/.github/actions/ensure-no-conflicting-release@main
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release-tag: ${{ needs.prepare.outputs.date }}

      - name: Create the dated prerelease (never latest) and upload assets
        env:
          # PAT, not github.token: the integration token CANNOT create a
          # ref (the release tag, via --target) that points at a commit
          # whose diff touches .github/workflows/** — known GitHub
          # limitation ("Resource not accessible by integration", hit
          # 2026-08-09 the first time a deploy batch's tip was a workflow
          # commit; the deletes in the steps above work fine with it).
          # The push-tags trigger is removed above, so the PAT-created tag
          # cannot recurse into this workflow.
          GH_TOKEN: ${{ secrets.APIO_PR_TOKEN }}
          DATE: ${{ needs.prepare.outputs.date }}
        run: |
          ls -la apio-openxc7-*.tgz
          # every asset must carry the tag's date, or apio 404s at install
          for f in apio-openxc7-*.tgz; do
            case "$f" in
              *"-${DATE//-/}.tgz") ;;
              *) echo "::error::asset $f is not dated ${DATE//-/}"; exit 1 ;;
            esac
          done
          sha256sum apio-openxc7-*.tgz > SHA256SUMS
          cat SHA256SUMS
          # full BUILD-INFO of each package into the release text
          # (ecosystem convention, apio#927)
          # Member naming differs per platform (the linux/darwin packer tars
          # "-C dist ." -> "./BUILD-INFO.json"; the windows job appends the
          # bare "BUILD-INFO.json"), so resolve the actual member name from
          # the listing instead of hardcoding one form (2026-08-13 body
          # showed '{ "missing": true }' for two of the three packages).
          : > BUILD-INFOS.md
          for f in apio-openxc7-*.tgz; do
            M=$(tar tzf "$f" | grep -Ex '(\./)?BUILD-INFO\.json' | head -1 || true)
            {
              echo "**\`$f\`**"
              echo '```json'
              if [ -n "$M" ]; then tar xzf "$f" -O "$M"; else echo '{ "missing": true }'; fi
              echo '```'
              echo
            } >> BUILD-INFOS.md
          done
          cat > RELEASE-BODY.md <<EOFBODY
          openXC7 toolchain — $DATE. Validated by CI (package gate and
          regression suite on the three platforms).

          ### On-demand chipdb
          The three packages ship **no chipdb**: their \`chipdb/\` directory
          holds a README.txt and apio downloads the device database its board
          needs from the per-FPGA assets below, into that same directory.
          \`CHIPDB-INFO.json\`, at the root of every package, lists every
          footprint the packaged prjxray database supports, which of them this
          release built, and the asset, size and sha256 of each one; it is
          published here too as \`apio-xilinx-chipdb-index-${DATE//-/}.json\`.
          Those bins and the packages come from the same chipdb job of this run
          (identity \`${{ needs.chipdb.outputs.identity }}\`,
          ${{ needs.chipdb.outputs.mode }}), and each platform's gates validate
          its package with them injected the way apio leaves them. A bin only
          works with the package of the SAME tag.

          ### Build info
          $(cat BUILD-INFOS.md)

          ### Pre-release note
          This daily release was created as a pre-release and will be deleted
          after a few days.
          * To KEEP it around for longer testing: uncheck \`Set as a
            pre-release\` (no side effects — it just survives the cleanup).
          * To PUBLISH it (after testing it for real): run the
            \`make-pre-release-stable\` workflow with this tag (verifies the assets,
            marks the release stable + latest), then update apio's
            remote-config by hand (apio#927).
          EOFBODY
          gh release create "$DATE" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$DATE" --prerelease --latest=false \
            --notes-file RELEASE-BODY.md
          gh release upload "$DATE" apio-openxc7-*.tgz SHA256SUMS \
            chipdb-assets/* --repo "$GITHUB_REPOSITORY"

      # Close the loop: re-resolve every asset by apio's tag->date->name rule
      # against what GitHub actually serves, and require the published
      # SHA256SUMS to match the tarballs validated above (the 2026-07-24
      # class of failure -- a tag apio resolves to nothing -- dies here).
      - name: Verify the published assets the way apio will fetch them
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_CHECK_REPO: ${{ github.repository }}
          DATE: ${{ needs.prepare.outputs.date }}
        run: |
          # The release-asset CDN is eventually consistent: seconds after
          # upload a HEAD can still 404 (the first full run failed here while
          # the very same check passed minutes later). Retry before failing.
          for attempt in 1 2 3 4; do
            bash scripts/asset-check.sh "$DATE" --expect-dir . && exit 0
            echo "asset-check attempt $attempt: assets may still be propagating; retrying"
            sleep 45
          done
          exit 1

      # Promotion stays a human decision; these are the steps it involves,
      # including the version bumps that keep apio aligned with
      # what is actually published (scripts/check-versions.sh asserts it).
      - name: Promotion checklist
        env:
          DATE: ${{ needs.prepare.outputs.date }}
        run: |
          {
            echo "## Release candidate \`$DATE\` published (prerelease, not latest)"
            echo
            echo "1. Try it for real (\`apio\` install from the tag, board test if it applies)."
            echo "2. (optional) Uncheck \`pre-release\` to keep it beyond the cleanup window while testing."
            echo "3. To PUBLISH: run the \`make-pre-release-stable\` workflow with tag \`$DATE\` (verifies, marks stable+latest), then update apio's remote-config by hand (scripts/bump-remote-config.sh helps)."
            echo "4. \`scripts/check-versions.sh\` must come back green afterwards."
          } >> "$GITHUB_STEP_SUMMARY"
