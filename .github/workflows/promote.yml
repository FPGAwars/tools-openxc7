# Promotion to production — an EXPLICIT human action, never a side effect.
#
# Ecosystem release states (FPGAwars convention):
#   1. pre-release          nightly, garbage-collected after a few days
#   2. stable (uncheck box) "keep this one around" — for longer testing.
#                           Marking stable has NO side effects here.
#   3. published            fully tested AND pinned in apio's remote-config
#   4. was-published        replaced by a newer published release
#
# This workflow is the 2→3 transition, run BY HAND when a release is
# deemed production-ready (Actions → promote → Run workflow, tag input):
#
#   1. re-verify the release the way apio will fetch it
#      (scripts/asset-check.sh) — a broken candidate stops HERE;
#   2. mark it stable + latest on GitHub (idempotent if already done);
#   3. open a PR against FPGAwars/apio bumping remote-config's openxc7
#      tag — and the definitions tag in the SAME PR (both pointers move
#      atomically; a board without its chipdb cannot happen). Needs the
#      APIO_PR_TOKEN secret (fine-grained PAT: apio + tools-openxc7,
#      Contents RW + Pull requests RW); without it, the diff lands in
#      the job summary for a manual PR instead of failing.
#
# Publishing therefore stays two deliberate human actions: this dispatch
# and merging the apio PR. scripts/check-versions.sh (see
# monitor-versions.yml) stands guard for drift in between.
name: promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Dated release tag to promote (YYYY-MM-DD)"
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-22.04            # ecosystem pin (apio hit issues on 24.04; see apio build-linux-x86-64.yaml)
    steps:
      - name: Guard — only dated release tags
        run: |
          TAG="${{ inputs.tag }}"
          case "$TAG" in
            20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]) echo "tag OK: $TAG" ;;
            *) echo "::error::'$TAG' is not a dated release tag (YYYY-MM-DD)"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify the release (asset-check)
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_CHECK_REPO: ${{ github.repository }}
        run: bash scripts/asset-check.sh "${{ inputs.tag }}"

      - name: Mark the release stable + latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --prerelease=false --latest
          echo "release ${{ inputs.tag }} is now stable and latest"

      - name: Open (or prepare) the apio remote-config PR
        env:
          TAG: ${{ inputs.tag }}
          APIO_PR_TOKEN: ${{ secrets.APIO_PR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # newest STABLE definitions release rides in the same PR
          DEFTAG=$(GH_TOKEN="${APIO_PR_TOKEN:-$GH_TOKEN}" gh release view \
            --repo FPGAwars/apio-definitions --json tagName -q .tagName 2>/dev/null || true)
          git clone --depth 1 https://github.com/FPGAwars/apio /tmp/apio
          ARGS="openxc7=$TAG"
          [ -n "$DEFTAG" ] && ARGS="$ARGS definitions=$DEFTAG"
          bash scripts/bump-remote-config.sh /tmp/apio/remote-config/apio-1.5.x.jsonc $ARGS
          cd /tmp/apio
          if git diff --quiet; then
            echo "remote-config already up to date" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff > /tmp/remote-config.patch
          if [ -z "${APIO_PR_TOKEN:-}" ]; then
            {
              echo "## APIO_PR_TOKEN not set — manual PR needed"
              echo '```diff'; cat /tmp/remote-config.patch; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="bump/openxc7-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "remote-config: openxc7 -> $TAG${DEFTAG:+, definitions -> $DEFTAG}"
          git push -f "https://x-access-token:${APIO_PR_TOKEN}@github.com/FPGAwars/apio" "$BRANCH"
          {
            printf 'Automated bump after promoting [tools-openxc7 %s](https://github.com/%s/releases/tag/%s).' \
              "$TAG" "${{ github.repository }}" "$TAG"
            [ -n "$DEFTAG" ] && printf ' Also pins definitions %s (released boards ride with their toolchain).' "$DEFTAG"
            printf '\n'
          } > /tmp/pr-body.md
          GH_TOKEN="$APIO_PR_TOKEN" gh pr create --repo FPGAwars/apio \
            --head "$BRANCH" --title "remote-config: openxc7 $TAG" \
            --body-file /tmp/pr-body.md \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || \
            echo "PR may already exist for $BRANCH" >> "$GITHUB_STEP_SUMMARY"
