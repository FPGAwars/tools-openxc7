# Build + validate the darwin-arm64 package on its native runner (macos-14,
# Apple Silicon). nixpkgs does not cross Linux<->macOS, so this is always a
# native build.
#
# Reusable only (workflow_call), like linux-package.yml: build-pre-release.yaml
# calls it after chipdb.yml. No push or dispatch trigger on purpose (packing
# is a deliverable, not a guard; test.yaml is the per-commit guard).
#
# chipdb.yml owns generation, cache, identity and the XILINX-PARTS-INDEX
# document. This job seeds the package from that job's bins, so the tarball
# ships them in chipdb/ (schema 8, apio#1070). L1 and L2 validate that
# tarball as it stands.
# This macOS runner only packages and validates the artifacts the calling
# run already produced on Linux.
name: darwin-package

on:
  workflow_call:
    inputs:
      date:
        description: "Package date YYYY-MM-DD (the release tag; apio derives the asset date from it)"
        required: true
        type: string
      yosys_release_tag:
        description: "Upstream YosysHQ oss-cad-suite release this package expects at runtime (BUILD-INFO matching key)"
        required: true
        type: string
      chipdb_source:
        description: "How the chipdb job obtained the bins (generated | restored-from-cache); recorded in BUILD-INFO"
        required: true
        type: string
      chipdb_id:
        description: "chipdb identity stamp of the bins this package is validated against; recorded in BUILD-INFO"
        required: true
        type: string
      parts_index:
        description: "Filename of the XILINX-PARTS-INDEX document in the parts-index artifact"
        required: true
        type: string
    outputs:
      tarball:
        description: "Name of the built tarball"
        value: ${{ jobs.build.outputs.tarball }}

jobs:
  build:
    name: build + validate darwin-arm64 (native)
    runs-on: macos-14              # Apple Silicon => darwin-arm64
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false          # no branded gantt/Discord footer
          diagnostic-endpoint: ""   # no telemetry

      - name: Resolve the package date
        id: d
        run: |
          DATE="${{ inputs.date }}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "dateid=${DATE//-/}" >> "$GITHUB_OUTPUT"
          echo "Package date: $DATE"

      # Seed for the packer: copied into the package's chipdb/ and shipped.
      - name: Download the verified chipdb bins
        uses: actions/download-artifact@v8
        with:
          name: chipdb-bins
          path: chipdb-bins

      - name: Download the XILINX-PARTS-INDEX document
        uses: actions/download-artifact@v8
        with:
          name: parts-index
          path: parts-index

      # Installed BEFORE composing BUILD-INFO: build-info.sh re-exports the
      # yosys-release-tag from the installed package's own BUILD-INFO.json
      # (the runtime matching key, apio#927).
      - name: Cache the oss-cad-suite validation env
        uses: actions/cache@v6
        with:
          path: ~/.local/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ hashFiles('scripts/ci-install-oss-cad-suite.sh') }}

      - name: Install oss-cad-suite (the user env, via our own installer)
        run: |
          [ -x "$HOME/.local/oss-cad-suite/bin/yosys" ] || bash scripts/ci-install-oss-cad-suite.sh
          # the validation env must BE the declared runtime expectation:
          # assert the installed apio oss-cad-suite repackages exactly the
          # yosys release this package will declare in BUILD-INFO (apio#927)
          DECLARED="${{ inputs.yosys_release_tag }}"
          GOT=$(python3 -c "import json;print(json.load(open('$HOME/.local/oss-cad-suite/BUILD-INFO.json')).get('yosys-release-tag','?'))" 2>/dev/null || echo "?")
          [ "$GOT" = "$DECLARED" ] \
            || { echo "::error::validation env yosys release ($GOT) != declared yosys_release_tag ($DECLARED)"; exit 1; }

      # chipdb provenance comes from the chipdb job of the calling run (its
      # outputs are this workflow's inputs).
      - name: Compose BUILD-INFO.json (ecosystem convention)
        env:
          YOSYS_RELEASE_TAG: ${{ inputs.yosys_release_tag }}
          CHIPDB_SOURCE: ${{ inputs.chipdb_source }}
          CHIPDB_ID: ${{ inputs.chipdb_id }}
        run: |
          DATE="${{ steps.d.outputs.date }}"
          bash scripts/build-info.sh darwin-arm64 "$DATE" \
            "apio-openxc7-darwin-arm64-${DATE//-/}.tgz" BUILD-INFO.json

      - name: Build the openXC7 package
        id: pack
        env:
          OPENXC7_PACK_DATE: ${{ steps.d.outputs.date }}
          OPENXC7_PARTS_INDEX: ${{ github.workspace }}/parts-index/${{ inputs.parts_index }}
          OPENXC7_BUILD_INFO: ${{ github.workspace }}/BUILD-INFO.json
          OPENXC7_CHIPDB_SEED: ${{ github.workspace }}/chipdb-bins
        run: |
          rm -rf dist   # stale-dist guard (see linux-package.yml)
          nix develop .#pack --command bash -c 'python3.12 openxc7-pack.py'
          TGZ=$(ls apio-openxc7-darwin-arm64-*.tgz)
          echo "tarball=$TGZ" >> "$GITHUB_OUTPUT"
          ls -la "$TGZ"

      # The bins are already in the tarball. L1 checks them against the index.
      - name: Validate the package inside the tarball (L1 gate)
        run: |
          export PATH="$HOME/.local/oss-cad-suite/bin:$PATH"
          bash scripts/validate-package.sh "${{ steps.pack.outputs.tarball }}" \
            --expect-date "${{ steps.d.outputs.dateid }}"

      # Same environment as L1 (the user env): the baselines carry the tool
      # versions they were recorded with, so a different yosys would drown
      # the report in version-mismatch warnings.
      - name: Fetch the locked third-party trees (regress/lock.json)
        run: bash scripts/fetch-demos.sh

      - name: Regression suite against the tarball (L2 gate)
        run: |
          export PATH="$HOME/.local/oss-cad-suite/bin:$PATH"
          bash scripts/regress.sh "${{ steps.pack.outputs.tarball }}" \
            --json regress-report.json --markdown regress-report.md

      - name: Publish the regression report in the job summary
        if: always()
        run: |
          [ -f regress-report.md ] && cat regress-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regress-report-darwin-arm64
          path: regress-report.*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: apio-openxc7-darwin-arm64
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
