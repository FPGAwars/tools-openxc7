# Generate (or restore) the chipdb and build every chipdb release asset.
#
# One chipdb file per die, chipdb-<die>.bin: the himbaechel xilinx uarch
# reads the same file for every part (package, speed grade) of a die. Each
# one is a deterministic serialization of prjxray-db (the engine's own
# generator, xilinx_gen.py, then bbasm): platform-independent by
# construction (a die generated on darwin came out byte-identical to the
# linux one).
# Generating them is the slow, memory-heavy step of the whole build (the
# generator of xc7z100 alone peaks at 12.4 GB, more than a hosted macOS
# runner has), so it happens ONCE here, on a linux runner. The packages
# ship none of those bins: apio downloads the one the board needs
# (apio#947), so `chipdb-bins` is what the platform jobs VALIDATE against,
# and the per-die `chipdb-assets` are what users actually get.
# `parts-index` (~50 kB) carries the document that maps parts to assets,
# which is all a platform job embeds.
#
# Owns two revision-keyed caches: the bins (a hit makes generation a few
# minutes; a miss regenerates every die of chipdb-parts.json) and the
# compressed assets (a pure function of the bins, so the same key applies).
# The .bin travel with their identity stamp (chipdb-id.txt): a seed, or an
# asset cache, from another toolchain revision is rejected instead of
# silently reused.
name: chipdb

on:
  workflow_call:
    inputs:
      date:
        description: "Asset date YYYY-MM-DD (the release tag the assets are named after)"
        required: true
        type: string
      regenerate:
        description: "Ignore the cache and generate every die from scratch (exercises the generation path even when nothing changed)"
        required: false
        default: false
        type: boolean
    outputs:
      identity:
        description: "chipdb identity stamp (chipdb-id.txt) of the produced bins"
        value: ${{ jobs.chipdb.outputs.identity }}
      mode:
        description: "How the bins were obtained in this run: generated | restored-from-cache (recorded in every package's BUILD-INFO)"
        value: ${{ jobs.chipdb.outputs.mode }}
      parts_index:
        description: "Filename of the XILINX-PARTS-INDEX document in the parts-index artifact"
        value: ${{ jobs.chipdb.outputs.parts_index }}

jobs:
  chipdb:
    name: chipdb (generate once, one source for the release)
    runs-on: ubuntu-22.04            # ecosystem runner version (apio hit issues on 24.04; see apio build-linux-x86-64.yaml)
    outputs:
      identity: ${{ steps.stamp.outputs.identity }}
      mode: ${{ steps.gen.outputs.mode }}
      parts_index: ${{ steps.assets.outputs.index }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false          # no branded gantt/Discord footer
          diagnostic-endpoint: ""   # no telemetry

      - name: Resolve the asset date
        id: d
        run: |
          DATE="${{ inputs.date }}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "dateid=${DATE//-/}" >> "$GITHUB_OUTPUT"
          echo "Asset date: $DATE"

      # The .bin are byte-identical per (nextpnr, prjxray-db, chipdb
      # derivation, manifest, patches) -> that tuple IS the cache key. It is
      # the set the packer hashes for the identity stamp (chipdb_identity()
      # in pack/chipdb.py; tests/test_chipdb_cache_key.py keeps the two
      # lists together), plus prjxray.nix, which only makes the key more
      # conservative. hashFiles hashes the set of files the patterns match
      # together, so the patch pattern matching nothing today (there is no
      # nix/patches) leaves the key unchanged; the empty string is only
      # returned when NO pattern matches. The v2 prefix starts the per-die
      # caches clean: the v1 entries hold one bin per base part.
      # `regenerate` skips the restore: the run must then produce every die
      # from scratch, which is how the generation path itself gets tested
      # without waiting for a toolchain revision change.
      - name: Restore the chipdb cache (keyed by revisions + manifest)
        if: ${{ !inputs.regenerate }}
        uses: actions/cache@v6
        with:
          path: chipdb-cache
          key: chipdb-v2-${{ hashFiles('nix/nextpnr-xilinx.nix', 'nix/prjxray-db.nix', 'nix/nextpnr-xilinx-chipdb.nix', 'nix/prjxray.nix', 'chipdb-parts.json', 'nix/patches/*.patch') }}

      # The .bin.tgz of a die is a pure function of its .bin, so the same
      # tuple keys them. Separate entry, not another path on the bins cache:
      # actions/cache does not re-save on an exact key hit, so adding a path
      # to a populated key would never fill it.
      - name: Restore the chipdb asset cache (same revisions + manifest)
        if: ${{ !inputs.regenerate }}
        uses: actions/cache@v6
        with:
          path: chipdb-assets-cache
          key: chipdb-assets-v2-${{ hashFiles('nix/nextpnr-xilinx.nix', 'nix/prjxray-db.nix', 'nix/nextpnr-xilinx-chipdb.nix', 'nix/prjxray.nix', 'chipdb-parts.json', 'nix/patches/*.patch') }}

      # Three dies at a time under the packer's default memory budget
      # (OPENXC7_CHIPDB_MEM_GB, 14 GB for this 16 GB runner): a die starts
      # only when its measured peak fits next to the ones running, so
      # xc7z100 and xc7z045 never run together. Measured on the build
      # server: 9 min for the 10 dies with 10 jobs, ~14 min one at a time.
      - name: Generate the chipdb (or seed it from the cache)
        id: gen
        env:
          OPENXC7_CHIPDB_JOBS: 3
        run: |
          rm -rf dist   # stale-dist guard (see pack/chipdb.py)
          if [ "${{ inputs.regenerate }}" = "true" ]; then
            rm -rf chipdb-cache
            echo "chipdb: regenerate requested, ignoring the cache"
          fi
          if [ -n "$(ls -A chipdb-cache 2>/dev/null || true)" ]; then
            export OPENXC7_CHIPDB_SEED="$PWD/chipdb-cache"
            echo "chipdb: seeding from cache ($(ls chipdb-cache/*.bin | wc -l) bins)"
            echo "mode=restored-from-cache" >> "$GITHUB_OUTPUT"
          else
            echo "chipdb: generating every manifest die from scratch (slow)"
            echo "mode=generated" >> "$GITHUB_OUTPUT"
          fi
          nix develop .#pack --command bash -c 'python3.12 openxc7-pack.py --chipdb-only'
          # refresh the cache content from what was produced (bins + stamp)
          mkdir -p chipdb-cache
          cp dist/chipdb/*.bin dist/chipdb/chipdb-id.txt chipdb-cache/
          ls -la chipdb-cache

      # The file list comes from the manifest through the packer's own rule
      # (pack.families.chipdb_dies): one chipdb-<die>.bin per die, and
      # nothing else next to them.
      - name: Assert every manifest die is present
        run: |
          python3 -c 'from pack.families import chipdb_dies; from pack.chipdb import chipdb_file; print("\n".join(chipdb_file(die) for _, die in chipdb_dies()))' > chipdb-files.txt
          test -s chipdb-files.txt
          while read -r f; do
            test -f "dist/chipdb/$f" || { echo "::error::chipdb missing: $f"; exit 1; }
          done < chipdb-files.txt
          for f in dist/chipdb/*.bin; do
            grep -Fxq "$(basename "$f")" chipdb-files.txt \
              || { echo "::error::unexpected chipdb file: $f"; exit 1; }
          done
          echo "chipdb complete: $(wc -l < chipdb-files.txt) dies"

      - name: Export the identity stamp
        id: stamp
        run: |
          ID=$(cat dist/chipdb/chipdb-id.txt)
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          echo "chipdb identity: $ID"
          {
            echo "### chipdb"
            echo "mode: **${{ steps.gen.outputs.mode }}** · identity: \`$ID\` · $(ls dist/chipdb/*.bin | wc -l) files, one per die"
            echo ""
            python3 - dist/chipdb <<'PYEOF'
          import hashlib, sys
          from pathlib import Path
          from pack.chipdb import chipdb_file
          from pack.families import chipdb_parts, die_of
          users = {}
          for _, part in chipdb_parts():
              users.setdefault(die_of(part), []).append(part)
          print("| file | die | manifest parts | bytes | sha256 |")
          print("|---|---|---|---:|---|")
          for die, parts in users.items():
              path = Path(sys.argv[1]) / chipdb_file(die)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"| {path.name} | {die} | {', '.join(parts)} "
                    f"| {path.stat().st_size} | {digest[:16]}… |")
          PYEOF
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the per-die assets and the XILINX-PARTS-INDEX document
        id: assets
        env:
          # a pure function of the bins: reused across dates, refreshed when
          # the identity stamp changes (pack/chipdb_assets.py)
          OPENXC7_ASSET_CACHE: ${{ github.workspace }}/chipdb-assets-cache
          OPENXC7_ASSET_JOBS: 4
        run: |
          rm -rf chipdb-assets
          START=$SECONDS
          bash scripts/chipdb-assets.sh \
            dist/chipdb chipdb-assets "${{ steps.d.outputs.dateid }}" \
            dist/share/nextpnr/external/prjxray-db
          echo "assets built in $((SECONDS - START))s"
          # The published index carries the same name as the file inside
          # every package, XILINX-PARTS-INDEX.json: the release it belongs
          # to is written inside it, so its name does not repeat the date
          # (PARTS-INDEX.json before the apio#1002 rename). The per-die
          # assets stay dated.
          INDEX="XILINX-PARTS-INDEX.json"
          test -f "chipdb-assets/$INDEX"
          echo "index=$INDEX" >> "$GITHUB_OUTPUT"
          python3 - "chipdb-assets/$INDEX" >> "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import json, sys
          data = json.load(open(sys.argv[1]))
          print("### parts index (XILINX-PARTS-INDEX.json)")
          print(f"schema: **{data['schema']}** · release-tag: "
                f"`{data['release-tag']}` · date: `{data['date']}`")
          print(f"built: **{data['generated-count']}** of {data['part-count']} parts "
                f"the packaged database supports ({data['base-part-count']} base "
                f"parts), from **{data['chipdb-count']}** chipdb files")
          print()
          print("| family | parts | built |")
          print("|---|---:|---:|")
          counts = {}
          for entry in data["parts"].values():
              tally = counts.setdefault(entry["family"], [0, 0])
              tally[0] += 1
              tally[1] += 1 if entry["generated"] else 0
          for family, (parts, built) in counts.items():
              print(f"| {family} | {parts} | {built} |")
          print()
          assets = {}
          for part, entry in data["parts"].items():
              if entry["generated"]:
                  row = assets.setdefault(entry["asset"], [entry, 0])
                  row[1] += 1
          print("| asset | chipdb file | parts | bytes |")
          print("|---|---|---:|---:|")
          for asset, (entry, parts) in assets.items():
              print(f"| {asset} | {entry['chipdb']} | {parts} "
                    f"| {entry['asset-size']} |")
          PYEOF

      # Consumed by the linux, darwin and windows package jobs of this run:
      # one generation, one set of bins, and the three gates validate their
      # package against those very bytes (no package ships them any more).
      - name: Publish the chipdb bins for the platform jobs
        uses: actions/upload-artifact@v7
        with:
          name: chipdb-bins
          path: |
            dist/chipdb/*.bin
            dist/chipdb/chipdb-id.txt
          compression-level: 1     # already dense binary data
          retention-days: 7
          if-no-files-found: error

      # The index alone (~50 kB), for the three package jobs: they embed it
      # as XILINX-PARTS-INDEX.json and never need the ~40 MB of assets next
      # to it.
      - name: Publish the XILINX-PARTS-INDEX document for the platform jobs
        uses: actions/upload-artifact@v7
        with:
          name: parts-index
          path: chipdb-assets/XILINX-PARTS-INDEX.json
          retention-days: 7
          if-no-files-found: error

      # Release inputs: uploaded unchanged by the pre-release job. These are
      # what users download -- the packages carry no chipdb.
      - name: Publish the per-die assets and the document
        uses: actions/upload-artifact@v7
        with:
          name: chipdb-assets
          path: chipdb-assets/*
          compression-level: 0     # the large files are already gzip streams
          retention-days: 7
          if-no-files-found: error
